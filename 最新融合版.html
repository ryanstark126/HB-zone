                  if (selectedDoc.type === 'video') {
                      return (
                          <div className={`${commonClass} bg-black hover:ring-2 hover:ring-purple-400`} onClick={() => setViewerData({ type: 'image', title: selectedDoc.name, url: null })}>
                              <img src={imgDam} className="w-full h-full object-cover opacity-40 group-hover:opacity-60 transition-opacity" alt="Video cover"/>
                              <div className="absolute inset-0 flex items-center justify-center"><div className="w-16 h-16 bg-white/20 backdrop-blur rounded-full flex items-center justify-center group-hover:scale-110 transition-transform"><Play className="text-white fill-white ml-1" size={24}/></div></div>
                          </div>
                      );
                  } else if (selectedDoc.type === 'model') {
                      return (
                          <div className={`${commonClass} bg-slate-900 hover:ring-2 hover:ring-cyan-400`} onClick={() => setViewerData({ type: 'pdf', title: selectedDoc.name })}>
                              <div className="absolute inset-0 bg-[linear-gradient(rgba(34,211,238,0.1)_1px,transparent_1px),linear-gradient(90deg,rgba(34,211,238,0.1)_1px,transparent_1px)] bg-[size:20px_20px] transform perspective(500px) rotateX(60deg) scale(1.5) origin-bottom"></div>
                              <Box size={72} className="text-cyan-400 opacity-80 animate-pulse relative z-10" strokeWidth={1} />
                              <div className="absolute top-4 left-4 bg-black/50 text-cyan-300 text-xs font-mono px-3 py-1 rounded border border-cyan-500/30 backdrop-blur z-10">LOD: 400 | BIM Node</div>
                          </div>
                      );
                  } else if (selectedDoc.type === 'image') {
                      return (
                          <div className={`${commonClass} bg-slate-200 hover:ring-2 hover:ring-emerald-400`} onClick={() => setViewerData({ type: 'image', title: selectedDoc.name, url: imgDam })}>
                              <img src={imgDam} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="site image"/>
                              <div className="absolute bottom-4 right-4 bg-black/60 text-white text-xs px-3 py-1.5 rounded backdrop-blur border border-white/20 flex items-center gap-1.5"><MapPin size={14}/> GPS 水印已存证</div>
                          </div>
                      );
                  } else {
                      return (
                          <div className={`${commonClass} bg-slate-100 border border-slate-200 hover:ring-2 hover:ring-blue-400`} onClick={() => setViewerData({ type: 'pdf', title: selectedDoc.name })}>
                              <selectedDoc.icon size={64} className={`mb-6 opacity-30 ${selectedDoc.color}`} />
                              <div className="w-3/4 h-2.5 bg-slate-200 rounded-full mb-4"></div><div className="w-full h-2.5 bg-slate-200 rounded-full mb-4"></div><div className="w-5/6 h-2.5 bg-slate-200 rounded-full"></div>
                              <div className="absolute top-4 right-4 text-xs font-bold text-slate-400 bg-white px-3 py-1.5 rounded shadow-sm border border-slate-200">{selectedDoc.version}</div>
                              <div className="absolute inset-0 bg-blue-50/0 group-hover:bg-blue-50/60 transition-colors flex items-center justify-center opacity-0 group-hover:opacity-100 backdrop-blur-[1px]">
                                  <span className="bg-white text-blue-600 px-5 py-2.5 rounded-lg shadow-lg text-sm font-bold flex items-center gap-2"><Eye size={18}/> 全屏检阅源文件</span>
                              </div>
                          </div>
                      );
                  }
              };

              return (
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 min-h-0 flex flex-col animate-in fade-in duration-300 overflow-hidden">
                      <UploadDocumentModal isOpen={isUploadModalOpen} onClose={() => setIsUploadModalOpen(false)} onSubmit={handleUploadSubmit} editDoc={docToEdit} currentRole={currentRole} />

                      <div className="px-6 py-4 border-b border-slate-200 bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shrink-0 z-10">
                          <div>
                              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Layers className="text-blue-600" size={24}/> 验评与图文在线协同 (SSOT)</h2>
                              <p className="text-xs text-slate-500 mt-1">严格根据角色权限进行数据隔离，保证所有参建方看到唯一的“单一事实数据源”。</p>
                          </div>
                          <div className="flex gap-2 bg-slate-200/50 p-1.5 rounded-lg border border-slate-200 shadow-inner w-full md:w-auto">
                              <button onClick={() => { setSsotView('workflow'); setSelectedDocId(null); }} className={`flex-1 md:flex-none px-5 py-2.5 rounded-md text-sm font-bold transition-all flex items-center justify-center gap-2 ${ssotView === 'workflow' ? 'bg-white text-blue-600 shadow border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}>
                                  <Inbox size={16}/> 工作流收件箱
                              </button>
                              <button onClick={() => { setSsotView('register'); setSelectedDocId(null); }} className={`flex-1 md:flex-none px-5 py-2.5 rounded-md text-sm font-bold transition-all flex items-center justify-center gap-2 ${ssotView === 'register' ? 'bg-white text-emerald-600 shadow border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}>
                                  <Archive size={16}/> 受控文档登记册
                              </button>
                          </div>
                      </div>

                      <div className="flex flex-1 min-h-0 relative">
                          <div className="w-56 border-r border-slate-200 bg-slate-50/50 hidden md:flex flex-col shrink-0">
                              <div className="p-5 font-bold text-sm text-slate-400 uppercase tracking-widest border-b border-slate-200 flex items-center gap-2"><Filter size={16}/> 按专业筛选</div>
                              <div className="p-3 space-y-1.5 overflow-y-auto">
                                  {disciplines.map(cat => (
                                      <button key={cat} onClick={() => { setSelectedDiscipline(cat); setSelectedDocId(null); }} className={`w-full text-left px-4 py-3 text-sm rounded-lg transition-colors ${selectedDiscipline === cat ? 'bg-blue-100 text-blue-700 font-bold border border-blue-200 shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}>
                                          {cat}
                                      </button>
                                  ))}
                              </div>
                          </div>

                          <div className={`flex-1 flex flex-col min-w-0 bg-white`}>
                              <div className="p-4 border-b border-slate-200 flex justify-between items-center shrink-0">
                                  <div className="relative w-72 lg:w-96">
                                      <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={16}/>
                                      <input type="text" placeholder="搜索文档编号或名称..." className="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 shadow-inner transition-all"/>
                                  </div>
                                  {currentRole.id === 'contractor' && ssotView === 'workflow' && (
                                      <button onClick={() => { setDocToEdit(null); setIsUploadModalOpen(true); }} className="bg-blue-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-700 flex items-center gap-2 transition-colors active:scale-95">
                                          <FilePlus size={16}/> 新增起草资料
                                      </button>
                                  )}
                              </div>
                              
                              <div className="flex-1 overflow-auto custom-scrollbar bg-slate-50/30">
                                  {filteredDocs.length === 0 ? (
                                      <div className="h-full flex flex-col items-center justify-center text-slate-400 opacity-60">
                                          <CheckCircle2 size={64} className="mb-4 text-emerald-400"/>
                                          <span className="text-lg font-bold text-slate-600">当前视图下无任务</span>
                                          <p className="text-sm mt-2">您 ({currentRole.name}) 的收件箱已清空，或该专业暂无资料。</p>
                                      </div>
                                  ) : (
                                      <table className="w-full text-left text-sm min-w-[900px] border-collapse">
                                          <thead className="bg-slate-100 text-slate-500 sticky top-0 border-b border-slate-200 shadow-sm z-10">
                                              <tr>
                                                  <th className="px-6 py-4 font-bold w-16 whitespace-nowrap">类型</th>
                                                  <th className="px-6 py-4 font-bold whitespace-nowrap">文档编号 (Doc No.)</th>
                                                  <th className="px-6 py-4 font-bold whitespace-nowrap">版本</th>
                                                  <th className="px-6 py-4 font-bold w-1/3">文档标题</th>
                                                  <th className="px-6 py-4 font-bold whitespace-nowrap">专业</th>
                                                  <th className="px-6 py-4 font-bold whitespace-nowrap">当前状态</th>
                                                  <th className="px-6 py-4 font-bold whitespace-nowrap">更新时间</th>
                                              </tr>
                                          </thead>
                                          <tbody className="divide-y divide-slate-100 bg-white">
                                              {filteredDocs.map(doc => (
                                                  <tr key={doc.id} onClick={() => { setSelectedDocId(doc.id); setApprovalActionState('idle'); setRightPanelTab('workflow'); }} className={`cursor-pointer hover:bg-blue-50/50 transition-colors ${selectedDocId === doc.id ? 'bg-blue-50/80 ring-1 ring-inset ring-blue-400 relative z-0' : ''}`}>
                                                      <td className="px-6 py-4 whitespace-nowrap"><div className={`w-10 h-10 rounded-lg flex items-center justify-center bg-slate-50 border border-slate-200 shadow-sm ${doc.color}`}><doc.icon size={20} /></div></td>
                                                      <td className="px-6 py-4 font-mono font-bold text-slate-700 whitespace-nowrap">{doc.docNo}</td>
                                                      <td className="px-6 py-4 font-mono text-slate-500 font-bold whitespace-nowrap"><span className="bg-slate-50 border border-slate-200 px-2 py-1 rounded">{doc.version}</span></td>
                                                      <td className="px-6 py-4 font-bold text-slate-800 truncate max-w-sm" title={doc.name}>{doc.name}</td>
                                                      <td className="px-6 py-4 whitespace-nowrap"><span className="bg-slate-100 text-slate-600 px-2 py-1 rounded border border-slate-200 text-xs font-bold">{doc.discipline}</span></td>
                                                      <td className="px-6 py-4 whitespace-nowrap">{getStatusBadge(doc.phase, doc.reviewCode)}</td>
                                                      <td className="px-6 py-4 font-mono text-slate-400 text-xs whitespace-nowrap">{doc.date}</td>
                                                  </tr>
                                              ))}
                                          </tbody>
                                      </table>
                                  )}
                              </div>
                          </div>

                          {selectedDoc && (
                              <Fragment>
                                  <div className="md:hidden absolute inset-0 bg-slate-900/50 z-20" onClick={() => setSelectedDocId(null)}></div>
                                  <div className="absolute md:static right-0 top-0 bottom-0 w-[90%] md:w-[450px] lg:w-[480px] xl:w-[550px] bg-white border-l border-slate-200 shadow-[-10px_0_20px_rgba(0,0,0,0.05)] md:shadow-none flex flex-col animate-in slide-in-from-right-4 duration-300 z-30 shrink-0">
                                      <div className="px-6 py-5 border-b border-slate-200 bg-slate-50 flex justify-between items-center shrink-0">
                                          <div>
                                              <h3 className="font-bold text-slate-800 text-base flex items-center gap-2"><Layers size={18} className="text-blue-500"/> 资料协作台</h3>
                                              <p className="text-xs font-mono text-slate-500 mt-1.5 uppercase tracking-wider">{selectedDoc.docNo} | {selectedDoc.version}</p>
                                          </div>
                                          <button onClick={() => setSelectedDocId(null)} className="p-2 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg text-slate-500 transition-colors shadow-sm"><X size={18}/></button>
                                      </div>

                                      <div className="flex px-6 bg-white border-b border-slate-200 shrink-0">
                                          <button onClick={() => setRightPanelTab('workflow')} className={`py-4 px-4 text-sm font-bold transition-all border-b-2 flex items-center gap-2 ${rightPanelTab === 'workflow' ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}><ArrowRight size={16}/> 流程追踪</button>
                                          <button onClick={() => setRightPanelTab('history')} className={`py-4 px-4 text-sm font-bold transition-all border-b-2 flex items-center gap-2 ${rightPanelTab === 'history' ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}><History size={16}/> 版本历史 <span className="bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded-full text-[10px] ml-1">{selectedDoc.history.length}</span></button>
                                      </div>

                                      <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col bg-slate-50/30">
                                          {rightPanelTab === 'workflow' ? (
                                              <Fragment>
                                                <div className="p-6 border-b border-slate-200 bg-white shrink-0">
                                                    {renderPreviewArea()}
                                                    <div className="mt-5 flex gap-3">
                                                        <button className="flex-1 bg-white border border-slate-300 hover:bg-slate-50 py-2.5 rounded-lg text-sm font-bold text-slate-700 flex items-center justify-center gap-2 shadow-sm transition-colors active:scale-95"><Download size={16}/> 获取附件</button>
                                                        <button className="flex-1 bg-white border border-slate-300 hover:bg-slate-50 py-2.5 rounded-lg text-sm font-bold text-slate-700 flex items-center justify-center gap-2 shadow-sm transition-colors active:scale-95"><MessageCircle size={16}/> 关联批注</button>
                                                    </div>
                                                </div>

                                                <div className="p-6 md:p-8 flex-1">
                                                    <div className="flex justify-between items-center mb-8">
                                                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2"><RefreshCw size={16}/> 流转状态表 (Workflow)</h4>
                                                        {selectedDoc.phase === 1 && currentRole.id === 'consultant' && (
                                                            <button className="text-xs font-bold text-indigo-600 bg-indigo-50 border border-indigo-200 px-3 py-1.5 rounded-md flex items-center gap-1.5 hover:bg-indigo-100 transition-colors">
                                                                <Sparkles size={14}/> AI 辅助合规审查
                                                            </button>
                                                        )}
                                                    </div>
                                                    
                                                    <div className="relative pl-6">
                                                        <FlowNode 
                                                            title="1. 内部起草与发版分发" desc={selectedDoc.phase > 0 ? "文档已打包提交至正式审阅流。" : "草稿状态，请确认无误后发送 Transmittal单。"} role="施工单位" status={selectedDoc.phase >= 1 ? 'done' : 'active'}
                                                            actionBtn={
                                                                selectedDoc.phase === 0 ? (
                                                                    currentRole.id === 'contractor' ? (
                                                                        <button onClick={() => handlePhaseAction(1, "分发流转单已创建，已发往监理单位审查。", null)} className="w-full bg-blue-600 text-white text-sm font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 active:scale-95 flex items-center justify-center gap-2 transition-all">
                                                                            {approvalActionState === 'approving' ? <RefreshCw size={16} className="animate-spin"/> : <SendToBack size={16}/>} 发送流转分发单 (Transmit)
                                                                        </button>
                                                                    ) : (<div className="text-center text-xs text-orange-600 bg-orange-50 py-2 rounded font-bold border border-orange-200">当前步骤由【施工单位】执行</div>)
                                                                ) : null
                                                            }
                                                        />
                                                        <FlowNode 
                                                            title="2. 监理单位合规技术审查" desc={selectedDoc.phase > 1 ? "已完成专业审查，并分配了审查代码。" : (selectedDoc.phase === 1 ? "请严格分配 Aconex 标准 Review Code。" : "")} role="监理单位" status={selectedDoc.phase >= 2 ? 'done' : selectedDoc.phase === 4 ? 'reject' : (selectedDoc.phase === 1 ? 'active' : 'wait')}
                                                            actionBtn={
                                                                selectedDoc.phase === 1 ? (
                                                                    currentRole.id === 'consultant' ? (
                                                                        <div className="flex flex-col gap-3">
                                                                            <div className="flex gap-3">
                                                                                <button onClick={() => handlePhaseAction(2, "已分配 Code B，并流转至建设单位终审。", 'Code B')} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-3 rounded-lg shadow-md transition-all active:scale-95 flex items-center justify-center gap-2"><CheckCircle2 size={16}/> 批准 (Code A/B)</button>
                                                                                <button onClick={() => handlePhaseAction(4, "已分配 Code C，要求施工单位修改重提。", 'Code C')} className="flex-1 bg-white border border-red-200 text-red-600 hover:bg-red-50 text-sm font-bold py-3 rounded-lg shadow-sm transition-all active:scale-95 flex items-center justify-center gap-2"><XCircle size={16}/> 驳回 (Code C)</button>
                                                                            </div>
                                                                            {approvalActionState === 'approving' && <div className="text-xs text-blue-600 bg-blue-50 p-2.5 rounded border border-blue-100 flex items-center justify-center gap-2"><RefreshCw size={14} className="animate-spin"/> 正在加盖个人电子签章并流转...</div>}
                                                                        </div>
                                                                    ) : (<div className="text-center text-xs text-orange-600 bg-orange-50 py-2 rounded font-bold border border-orange-200">当前步骤由【监理单位】执行</div>)
                                                                ) : selectedDoc.phase === 4 ? (
                                                                    <div className="flex flex-col gap-4">
                                                                        <div className="text-xs text-red-600 bg-red-50 p-3 rounded-lg border border-red-200 shadow-inner leading-relaxed"><span className="font-bold flex items-center gap-1.5 mb-1"><AlertTriangle size={14}/> 驳回意见：</span>图纸或模型存在碰撞冲突，请修改并升级版本(Rev)后重新提交。</div>
                                                                        {currentRole.id === 'contractor' && (
                                                                            <button onClick={() => { setDocToEdit(selectedDoc); setIsUploadModalOpen(true); }} className="w-full bg-blue-600 text-white text-sm font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 transition-all flex justify-center items-center gap-2 active:scale-95 animate-pulse">
                                                                                <ArrowUpCircle size={16}/> 针对驳回意见升版并重投 (Up-version)
                                                                            </button>
                                                                        )}
                                                                    </div>
                                                                ) : null
                                                            }
                                                        />
                                                        <FlowNode 
                                                            title="3. 建设单位最终定板授权" desc={selectedDoc.phase > 2 ? "建设单位代表已审定，文档正式生效受控。" : (selectedDoc.phase === 2 ? "请基于监理单位意见进行最终确认签批。" : "")} role="建设单位 (项目总控)" status={selectedDoc.phase >= 3 ? 'done' : (selectedDoc.phase === 2 ? 'active' : 'wait')}
                                                            actionBtn={
                                                                selectedDoc.phase === 2 ? (
                                                                    currentRole.id === 'owner' ? (
                                                                        <button onClick={() => handlePhaseAction(3, "定板成功，文件已触发哈希上链并归入公共库！", 'Code A')} className="w-full bg-blue-600 text-white text-xs font-bold py-2.5 rounded shadow-md hover:bg-blue-700 active:scale-95 flex items-center justify-center gap-1.5 transition-all">
                                                                            {approvalActionState === 'approving' ? <RefreshCw size={14} className="animate-spin"/> : <Stamp size={14}/>} 签批发布 (Approve & Publish)
                                                                        </button>
                                                                    ) : (<div className="text-center text-[10px] text-orange-600 bg-orange-50 py-1.5 rounded font-bold border border-orange-200">当前步骤由【建设单位】执行</div>)
                                                                ) : null
                                                            }
                                                        />
                                                        <FlowNode title="4. 公共库受控发布" desc={selectedDoc.phase >= 3 ? "生成版本快照哈希，全员可于 Register 中查阅。" : "等待前置节点审批完成。"} role="System (自动流转)" status={selectedDoc.phase >= 3 ? 'done' : 'wait'} isLast={true} />
                                                    </div>
                                                </div>
                                              </Fragment>
                                          ) : (
                                              <div className="p-8">
                                                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-8">版本追踪历史 (Version History)</h4>
                                                  <div className="space-y-5">
                                                      {[...selectedDoc.history].reverse().map((h, i) => (
                                                          <div key={i} className={`p-5 rounded-xl border ${i === 0 ? 'bg-blue-50 border-blue-200 shadow-md' : 'bg-white border-slate-200 shadow-sm opacity-80'} flex flex-col gap-3 relative overflow-hidden transition-all hover:opacity-100`}>
                                                              {i === 0 && <div className="absolute top-0 left-0 w-1.5 h-full bg-blue-500"></div>}
                                                              <div className="flex justify-between items-center">
                                                                  <span className={`font-mono font-bold ${i === 0 ? 'text-blue-700 text-base' : 'text-slate-600 text-sm'}`}>{h.v}</span>
                                                                  <span className="text-xs text-slate-400 font-mono flex items-center gap-1"><Clock size={12}/> {h.date}</span>
                                                              </div>
                                                              <div className="flex justify-between items-end border-t border-slate-200/60 pt-3">
                                                                  <span className="text-xs text-slate-500 font-medium">执行动作:</span>
                                                                  <span className={`text-xs font-bold px-2 py-1 rounded-md border ${h.action.includes('Reject') ? 'bg-red-50 text-red-600 border-red-200' : h.action.includes('Approve') ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-100 text-slate-700 border-slate-200'}`}>{h.action}</span>
                                                              </div>
                                                          </div>
                                                      ))}
                                                  </div>
                                              </div>
                                          )}
                                      </div>
                                  </div>
                              </Fragment>
                          )}
                      </div>
                  </div>
              );
          };

          // ================= Render 2: RFI 通信与联办 =================
          const renderRfiManage = () => {
              const filteredRfis = rfis.filter(r => rfiView === 'open' ? r.status === 'Open' : r.status === 'Closed');
              const selectedRfi = rfis.find(r => r.id === selectedRfiId);

              const handleReply = () => {
                  if(!rfiReplyText) return;
                  const newReply = { sender: currentRole.name.split(' ')[0], text: rfiReplyText, time: '刚刚' };
                  setRfis(prev => prev.map(r => r.id === selectedRfiId ? {...r, thread: [...r.thread, newReply]} : r));
                  setRfiReplyText('');
                  showToast('RFI 回复成功！');
              };

              const handleCloseRfi = () => {
                  setRfis(prev => prev.map(r => r.id === selectedRfiId ? {...r, status: 'Closed', thread: [...r.thread, {sender: currentRole.name.split(' ')[0], text: '问题已解决，RFI 状态更新为：已关闭。', time: '刚刚'}]} : r));
                  setSelectedRfiId(null);
                  showToast('RFI 已归档关闭！');
              };

              const handleCreateRfi = (subj, txt) => {
                  const newRfi = {
                      id: `RFI-2026-0${rfis.length + 43}`, status: 'Open', priority: 'High', subject: subj, author: currentRole.name.split(' ')[0], date: '刚刚',
                      thread: [{ sender: currentRole.name.split(' ')[0], text: txt, time: '刚刚' }]
                  };
                  setRfis([newRfi, ...rfis]);
                  setRfiView('open');
                  setSelectedRfiId(newRfi.id);
                  showToast('新 RFI 发起成功，已通知相关干系人！');
              };

              const triggerAiReply = () => {
                  setAiReplying(true);
                  setTimeout(() => {
                      setRfiReplyText('已收到现场反馈。经设计复核，同意将该区段引水管线标高整体下调 150mm 以避开岩层。请施工单位根据调整后的标高先行施工，后续我们将补发正式的设计变更指令单(SI)作为计量依据。');
                      setAiReplying(false);
                  }, 1200);
              }

              return (
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 min-h-0 flex flex-col animate-in fade-in overflow-hidden">
                      <CreateRfiModal isOpen={isCreateRfiModalOpen} onClose={()=>setIsCreateRfiModalOpen(false)} onSubmit={handleCreateRfi} />

                      <div className="px-6 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center shrink-0">
                          <div>
                              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><MessageSquare className="text-blue-600" size={24}/> 通信 RFI (Request For Information)</h2>
                              <p className="text-xs text-slate-500 mt-1">工程正式沟通网络。所有技术问询均在此闭环，形成后期签证索赔的有力依据。</p>
                          </div>
                          {currentRole.id === 'contractor' && (
                              <button onClick={()=>setIsCreateRfiModalOpen(true)} className="bg-blue-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-700 flex items-center gap-2 transition-colors active:scale-95">
                                  <Plus size={16}/> 发起新 RFI
                              </button>
                          )}
                      </div>

                      <div className="flex flex-1 min-h-0 relative">
                          {/* 左侧 RFI 列表 */}
                          <div className={`w-full md:w-[350px] lg:w-[400px] border-r border-slate-200 bg-slate-50/50 flex flex-col shrink-0 ${selectedRfiId ? 'hidden md:flex' : ''}`}>
                              <div className="flex p-3 gap-2 border-b border-slate-200 shrink-0 bg-white">
                                  <button onClick={()=>setRfiView('open')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${rfiView==='open' ? 'bg-blue-100 text-blue-700 shadow-sm border border-blue-200' : 'text-slate-500 hover:bg-slate-100'}`}>未关闭 (Open)</button>
                                  <button onClick={()=>setRfiView('closed')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${rfiView==='closed' ? 'bg-slate-200 text-slate-700 shadow-sm border border-slate-300' : 'text-slate-500 hover:bg-slate-100'}`}>已归档 (Closed)</button>
                              </div>
                              <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3">
                                  {filteredRfis.length === 0 && <div className="text-center text-slate-400 mt-10 text-sm">该视图下无 RFI</div>}
                                  {filteredRfis.map(rfi => (
                                      <div key={rfi.id} onClick={()=>setSelectedRfiId(rfi.id)} className={`p-4 rounded-xl border cursor-pointer transition-all ${selectedRfiId === rfi.id ? 'bg-white border-blue-400 shadow-md ring-2 ring-blue-100' : 'bg-white border-slate-200 hover:border-blue-300 shadow-sm'}`}>
                                          <div className="flex justify-between items-start mb-2">
                                              <span className="text-xs font-bold font-mono text-slate-500 bg-slate-100 px-1.5 rounded">{rfi.id}</span>
                                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${rfi.priority==='High'?'bg-red-50 text-red-600 border-red-200':'bg-slate-50 text-slate-500 border-slate-200'}`}>{rfi.priority}</span>
                                          </div>
                                          <h4 className="font-bold text-sm text-slate-800 leading-snug mb-3 line-clamp-2">{rfi.subject}</h4>
                                          <div className="flex justify-between items-center text-xs text-slate-500 border-t border-slate-100 pt-2">
                                              <span className="flex items-center gap-1.5"><UserCircle size={14}/> {rfi.author}</span>
                                              <span className="font-mono">{rfi.date}</span>
                                          </div>
                                      </div>
                                  ))}
                              </div>
                          </div>

                          {/* 右侧 RFI 会话详情 */}
                          <div className={`flex-1 flex flex-col bg-slate-50/50 ${!selectedRfiId ? 'hidden md:flex' : ''}`}>
                              {selectedRfi ? (
                                  <Fragment>
                                      <div className="p-6 border-b border-slate-200 shrink-0 shadow-sm z-10 flex justify-between items-center bg-white">
                                          <div>
                                              <button onClick={()=>setSelectedRfiId(null)} className="md:hidden mb-3 text-blue-600 font-bold text-sm flex items-center gap-1"><ChevronDown className="rotate-90" size={16}/> 返回 RFI 列表</button>
                                              <h3 className="text-lg font-bold text-slate-800 mb-1">{selectedRfi.subject}</h3>
                                              <p className="text-xs text-slate-500 font-mono">Ref: {selectedRfi.id} | Status: <span className={selectedRfi.status==='Open'?'text-blue-600 font-bold':'text-slate-400'}>{selectedRfi.status}</span></p>
                                          </div>
                                          <div className="flex gap-2">
                                            <button className="bg-indigo-50 border border-indigo-200 text-indigo-600 hover:bg-indigo-100 px-4 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-1.5 hidden lg:flex">
                                                <FileSearch size={16}/> AI 相似问题检索
                                            </button>
                                            {selectedRfi.status === 'Open' && currentRole.id !== 'contractor' && (
                                                <button onClick={handleCloseRfi} className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-all flex items-center gap-2">
                                                    <Archive size={16}/> 完结 RFI
                                                </button>
                                            )}
                                          </div>
                                      </div>
                                      
                                      <div className="flex-1 overflow-y-auto custom-scrollbar p-6 md:p-8 space-y-6">
                                          {/* AI 相似推荐面板 */}
                                          {currentRole.id === 'consultant' && selectedRfi.status === 'Open' && (
                                              <div className="bg-indigo-50/80 border border-indigo-200 rounded-xl p-4 shadow-sm animate-in fade-in slide-in-from-top-4">
                                                  <div className="flex items-center gap-2 text-indigo-800 font-bold text-xs mb-2"><Sparkles size={14}/> AI 智能历史 RFI 关联推荐</div>
                                                  <div className="bg-white p-3 rounded-lg border border-indigo-100 text-xs text-slate-600 flex justify-between items-center cursor-pointer hover:border-indigo-300">
                                                      <div>
                                                          <span className="font-mono font-bold text-indigo-500 mr-2">RFI-2025-112</span>
                                                          [相似度 85%] 一期工程引水洞管线标高冲突处理方案
                                                      </div>
                                                      <ArrowRight size={14} className="text-indigo-400"/>
                                                  </div>
                                              </div>
                                          )}

                                          {selectedRfi.thread.map((msg, i) => (
                                              <div key={i} className="flex gap-4">
                                                  <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 shrink-0 font-bold border border-blue-200 shadow-sm"><UserCircle size={20}/></div>
                                                  <div className="flex-1 bg-white border border-slate-200 rounded-2xl rounded-tl-none p-5 shadow-sm relative">
                                                      <div className="flex justify-between items-center mb-3">
                                                          <span className="font-bold text-sm text-slate-800">{msg.sender}</span>
                                                          <span className="text-xs text-slate-400 font-mono">{msg.time}</span>
                                                      </div>
                                                      <p className="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                                                      {msg.files && (
                                                          <div className="mt-4 pt-3 border-t border-slate-100 flex gap-2">
                                                              {msg.files.map((f, j)=>(
                                                                  <div key={j} onClick={()=>setViewerData({type:'image', title:f, url:imgDam})} className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-md text-xs font-bold text-blue-600 cursor-pointer hover:border-blue-300 hover:shadow-sm transition-all"><Paperclip size={14}/> {f}</div>
                                                              ))}
                                                          </div>
                                                      )}
                                                  </div>
                                              </div>
                                          ))}
                                      </div>

                                      {selectedRfi.status === 'Open' && (
                                          <div className="p-6 border-t border-slate-200 bg-white shrink-0">
                                              <div className="border border-slate-300 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-blue-400 focus-within:border-blue-400 transition-all shadow-sm">
                                                  <textarea 
                                                      value={rfiReplyText} onChange={e=>setRfiReplyText(e.target.value)}
                                                      className="w-full p-4 text-sm outline-none resize-none h-28 text-slate-700" 
                                                      placeholder="输入您的官方回复或补充指令..."
                                                  ></textarea>
                                                  <div className="bg-slate-50 px-4 py-3 border-t border-slate-200 flex justify-between items-center">
                                                      <div className="flex items-center gap-2">
                                                          <button className="text-slate-500 hover:text-blue-600 transition-colors p-1" title="添加附件"><Paperclip size={18}/></button>
                                                          {/* AI 润色按钮 */}
                                                          <button onClick={triggerAiReply} disabled={aiReplying} className="text-indigo-600 hover:bg-indigo-100 px-2 py-1 rounded text-xs font-bold flex items-center gap-1 transition-colors disabled:opacity-50">
                                                              {aiReplying ? <RefreshCw size={14} className="animate-spin"/> : <Wand2 size={14}/>} AI 润色回复
                                                          </button>
                                                      </div>
                                                      <button onClick={handleReply} disabled={!rfiReplyText} className="bg-blue-600 text-white px-8 py-2.5 rounded-lg text-sm font-bold shadow-md hover:bg-blue-700 disabled:opacity-50 flex items-center gap-2 transition-all">
                                                          <Send size={16}/> 发送函件
                                                      </button>
                                                  </div>
                                              </div>
                                          </div>
                                      )}
                                  </Fragment>
                              ) : (
                                  <div className="flex-1 flex flex-col items-center justify-center text-slate-400 opacity-60">
                                      <MessageSquare size={64} className="mb-4 text-slate-300"/>
                                      <p className="text-lg font-bold">请选择左侧 RFI 查阅通信记录</p>
                                  </div>
                              )}
                          </div>
                      </div>
                  </div>
              );
          };

          // ================= Render 3: 变更溯源 =================
          const renderChangeTrace = () => {
              const changeChain = [
                  { type: 'RFI', docNo: 'RFI-2026-042', title: '地下室管线标高冲突疑问', owner: '施工单位 (发起)', status: '已关闭', date: '05-18' },
                  { type: 'SI', docNo: 'SI-015', title: '设计标高现场调整指令单', owner: '监理单位设计部 (下达)', status: '已执行', date: '05-19' },
                  { type: 'Quote', docNo: 'QUO-008', title: '管线绕排工程量增项报价', owner: '施工单位 (估价)', status: '待审批', date: '05-20' },
                  { type: 'VO', docNo: 'VO-003', title: '第3号工程变更与签证 (VO)', owner: '建设单位 (终审)', status: '未生成', date: '-' }
              ];

              return (
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 min-h-0 flex flex-col animate-in fade-in overflow-hidden p-8 lg:p-12 relative">
                      <div className="mb-8 flex justify-between items-start">
                          <div>
                              <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-3"><GitCommit className="text-indigo-600"/> 变更溯源证据链 (Change Trace)</h2>
                              <p className="text-sm text-slate-500 mt-2">将孤立的工程单据按照业务流逻辑串联，形成从“发现问题”到“现场指令”再到“变更支付”的单一事实视图。</p>
                          </div>
                          <button onClick={() => setShowAiRisk(!showAiRisk)} className={`px-5 py-2.5 rounded-lg text-sm font-bold shadow-md transition-all flex items-center gap-2 ${showAiRisk ? 'bg-indigo-100 text-indigo-700 border border-indigo-300' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                              <ActivitySquare size={16}/> {showAiRisk ? '关闭推演面板' : 'AI 变更影响沙盘推演'}
                          </button>
                      </div>

                      {showAiRisk && (
                          <div className="mb-8 bg-indigo-900 text-white rounded-xl p-6 shadow-lg animate-in slide-in-from-top-4 flex gap-8 border border-indigo-700">
                              <div className="w-1/3 border-r border-indigo-700/50 pr-8">
                                  <h4 className="text-indigo-300 text-xs font-bold tracking-widest mb-4 flex items-center gap-2"><Sparkles size={14}/> 大模型影响推演</h4>
                                  <p className="text-sm leading-relaxed text-indigo-100">基于《第3号工程变更与签证 (VO)》草案，AI 分析了变更导致的物料增项与窝工时间，得出的动态影响预测如下：</p>
                              </div>
                              <div className="flex-1 grid grid-cols-2 gap-6">
                                  <div className="bg-black/20 rounded-lg p-4 border border-white/10">
                                      <div className="text-xs text-indigo-300 mb-1">预计造价增加 (Cost Impact)</div>
                                      <div className="text-2xl font-black font-mono text-red-400">+ ¥ 85,400.00</div>
                                      <div className="mt-2 text-[10px] text-indigo-200">触发阈值警告：超预算备用金池 12%</div>
                                  </div>
                                  <div className="bg-black/20 rounded-lg p-4 border border-white/10">
                                      <div className="text-xs text-indigo-300 mb-1">预计工期延误 (Time Impact)</div>
                                      <div className="text-2xl font-black font-mono text-orange-400">+ 3.5 天</div>
                                      <div className="mt-2 text-[10px] text-indigo-200">关键路径：未影响主体封顶里程碑。</div>
                                  </div>
                              </div>
                          </div>
                      )}

                      <div className="flex-1 bg-slate-50/50 border border-slate-200 rounded-xl p-8 overflow-x-auto flex items-center custom-scrollbar shadow-inner min-h-[300px]">
                          <div className="flex items-center min-w-max pb-10 px-8">
                              {changeChain.map((node, idx) => (
                                  <Fragment key={idx}>
                                      <div className={`w-72 rounded-xl border-2 p-6 shadow-lg relative bg-white transition-all hover:-translate-y-1 hover:shadow-xl ${node.status === '已关闭' || node.status === '已执行' ? 'border-indigo-400 ring-4 ring-indigo-50' : 'border-slate-200 opacity-60'}`}>
                                          <div className={`absolute -top-3.5 left-5 text-[10px] font-bold px-3 py-1 rounded-full border shadow-sm ${node.status === '已关闭' || node.status === '已执行' ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>
                                              {node.type}
                                          </div>
                                          <div className="mt-3 font-mono text-xs text-slate-400 mb-1.5 flex justify-between">
                                              <span>{node.docNo}</span>
                                              <span className={`px-1.5 rounded ${node.status === '待审批' ? 'bg-orange-100 text-orange-600' : ''}`}>{node.status}</span>
                                          </div>
                                          <div className="font-bold text-slate-800 text-lg leading-snug mb-5">{node.title}</div>
                                          <div className="flex justify-between items-center text-xs text-slate-500 border-t border-slate-100 pt-4">
                                              <span className="flex items-center gap-1.5"><UserCircle size={14}/> {node.owner}</span>
                                              <span className="font-mono">{node.date}</span>
                                          </div>
                                      </div>

                                      {idx < changeChain.length - 1 && (
                                          <div className="flex flex-col items-center justify-center w-16 md:w-24 relative">
                                              <div className={`w-full h-1.5 relative rounded-full ${idx < 2 ? 'bg-indigo-300' : 'bg-slate-200'}`}>
                                                  {idx < 2 && <div className="absolute top-0 left-0 w-full h-full bg-indigo-500 animate-pulse rounded-full"></div>}
                                              </div>
                                              <ArrowRight size={20} className={`absolute -right-3 ${idx < 2 ? 'text-indigo-600' : 'text-slate-300'}`}/>
                                          </div>
                                      )}
                                  </Fragment>
                              ))}
                          </div>
                      </div>
                  </div>
              );
          };

          // ================= Render 4: 在线签章 =================
          const renderESignature = () => {
              const selectedDocObj = signDocs.find(d => d.id === selectedSignId);

              const handleSign = () => {
                  setSignStep(1); 
                  setTimeout(() => {
                      setSignStep(2); 
                      setTimeout(() => {
                          setSignStep(3); 
                          setTimeout(() => {
                              setIsSigned(true);
                              setSignStep(4); 
                              setTimeout(() => {
                                  setSignDocs(prev => prev.filter(d => d.id !== selectedSignId));
                                  setSelectedSignId(null);
                                  setIsSigned(false);
                                  setSignStep(0);
                                  showToast('CA 数字签名及电子印章加盖成功，已上链存证！');
                              }, 2000); 
                          }, 1500);
                      }, 1500);
                  }, 2000);
              };

              return (
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 min-h-0 flex flex-col animate-in fade-in overflow-hidden">
                      <div className="px-6 py-5 border-b border-slate-200 bg-slate-50 flex justify-between items-center shrink-0">
                          <div>
                              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Key className="text-blue-600" size={24}/> CA 数字签章工作台</h2>
                              <p className="text-xs text-slate-500 mt-1">对接国家许可 CA 机构，支持 UKey 认证。内置 AI 合同一致性比对防范风险。</p>
                          </div>
                      </div>
                      
                      <div className="flex flex-1 min-h-0">
                          {/* 待签列表 - 侧边栏 */}
                          <div className="w-full md:w-[350px] lg:w-[400px] border-r border-slate-200 bg-slate-50/50 flex flex-col shrink-0">
                              <div className="p-4 border-b border-slate-200 font-bold text-sm flex items-center gap-2 text-slate-700 bg-white shadow-sm"><FileSignature size={18}/> 待您签署的文件 ({signDocs.filter(d => d.requireRole === currentRole.id).length})</div>
                              <div className="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                                  {signDocs.filter(d => d.requireRole === currentRole.id).length === 0 ? (
                                      <div className="text-center text-slate-400 mt-10 text-sm">当前无待签文件</div>
                                  ) : (
                                      signDocs.filter(d => d.requireRole === currentRole.id).map(doc => (
                                          <div key={doc.id} onClick={()=>{ setSelectedSignId(doc.id); setSignStep(0); setIsSigned(false); }} className={`p-4 bg-white border rounded-xl cursor-pointer hover:shadow-md transition-all ${selectedSignId === doc.id ? 'border-red-400 ring-2 ring-red-100' : 'border-slate-200'}`}>
                                              <div className="flex items-start gap-3">
                                                  <div className="p-2.5 bg-red-50 text-red-600 rounded-lg shrink-0 border border-red-100"><doc.icon size={20}/></div>
                                                  <div className="min-w-0">
                                                      <div className="font-bold text-sm text-slate-800 leading-snug line-clamp-2" title={doc.name}>{doc.name}</div>
                                                      <div className="text-xs text-orange-600 mt-2 font-bold bg-orange-50 inline-block px-2 py-1 rounded border border-orange-200">需加盖企业印章 / 法人章</div>
                                                  </div>
                                              </div>
                                          </div>
                                      ))
                                  )}
                              </div>
                          </div>

                          {/* 签章工作台 - 主区域 */}
                          <div className={`flex-1 bg-slate-200/80 p-6 flex-col items-center justify-start relative overflow-y-auto custom-scrollbar ${!selectedSignId ? 'hidden md:flex' : 'flex'}`}>
                              {selectedSignId ? (
                                  <div className="w-full max-w-5xl mx-auto flex flex-col xl:flex-row gap-6 items-start animate-in zoom-in-95">
                                      <button onClick={()=>setSelectedSignId(null)} className="xl:hidden absolute top-2 left-2 text-slate-500 font-bold text-xs z-50 bg-white px-2 py-1 rounded shadow"><ChevronDown className="rotate-90 inline" size={16}/> 返回列表</button>
                                      
                                      {/* 左侧：凭证预览与盖章区 */}
                                      <div className="flex-1 bg-white w-full min-h-[700px] shadow-2xl relative flex flex-col items-center p-12 border border-slate-300 rounded-xl">
                                          <FileText size={64} className="text-slate-200 mb-8"/>
                                          <div className="w-3/4 h-3 bg-slate-100 rounded-full mb-4"></div>
                                          <div className="w-full h-3 bg-slate-100 rounded-full mb-4"></div>
                                          <div className="w-5/6 h-3 bg-slate-100 rounded-full mb-12"></div>
                                          <div className="w-1/2 h-3 bg-slate-100 rounded-full mb-4"></div>
                                          <div className="w-2/3 h-3 bg-slate-100 rounded-full mb-4"></div>
                                          
                                          {/* 签章落款区 */}
                                          <div className="mt-auto w-full flex justify-end">
                                              <div className={`w-40 h-40 flex items-center justify-center relative rounded-lg overflow-hidden transition-all ${isSigned ? '' : 'border-2 border-dashed border-red-200 bg-red-50/30'}`}>
                                                  {signStep === 0 && <span className="text-red-400 text-xs font-bold tracking-widest">印章预留区</span>}
                                                  {signStep === 3 && <RefreshCw size={24} className="animate-spin text-red-500"/>}
                                                  {/* 盖下的印章效果 */}
                                                  <Stamp size={120} className={`absolute text-red-600 rotate-[-15deg] drop-shadow-md transition-all duration-300 ease-out ${isSigned ? 'opacity-90 scale-100' : 'opacity-0 scale-150'}`}/>
                                              </div>
                                          </div>
                                      </div>

                                      {/* 右侧：业务详情与操作面板 */}
                                      <div className="w-full xl:w-[360px] flex flex-col gap-5 shrink-0 animate-in slide-in-from-right-8">
                                          
                                          {/* 详情卡片 */}
                                          <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                              <h4 className="font-bold text-slate-800 border-b border-slate-100 pb-3 mb-4 flex items-center gap-2"><FileCheck size={16} className="text-blue-500"/> 签批任务详情</h4>
                                              <div className="space-y-3.5 text-sm">
                                                  <div className="flex justify-between items-center"><span className="text-slate-500">业务单号</span><span className="font-mono bg-slate-100 px-1.5 rounded">{selectedDocObj.docNo}</span></div>
                                                  <div className="flex justify-between items-center"><span className="text-slate-500">发起方</span><span className="font-medium text-slate-700">{selectedDocObj.initiator}</span></div>
                                                  <div className="flex justify-between items-center"><span className="text-slate-500">涉审金额</span><span className="font-bold text-blue-600">{selectedDocObj.amount}</span></div>
                                                  <div className="flex justify-between items-center"><span className="text-slate-500">底层哈希</span><span className="font-mono text-xs text-slate-400" title={selectedDocObj.hash}>{selectedDocObj.hash}</span></div>
                                              </div>
                                          </div>

                                          {/* AI 合规审计日志 */}
                                          <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                              <h4 className="font-bold text-slate-800 border-b border-slate-100 pb-3 mb-4 flex items-center gap-2"><Sparkles size={16} className="text-indigo-500"/> 智能合规拦截 (前置校验)</h4>
                                              {signStep >= 1 ? (
                                                  <div className="space-y-2 text-xs font-mono">
                                                      <div className="flex items-center gap-2 text-emerald-600"><CheckCircle2 size={12}/> AI: 文件关键金额与系统台账一致。</div>
                                                      <div className="flex items-center gap-2 text-emerald-600"><CheckCircle2 size={12}/> 哈希: 文档指纹 0x8a92 未被篡改。</div>
                                                      <div className="flex items-center gap-2 text-emerald-600"><CheckCircle2 size={12}/> 权限: 匹配到有效的待签权。</div>
                                                  </div>
                                              ) : (
                                                  <div className="text-xs text-slate-400 bg-slate-50 p-3 rounded text-center border border-slate-100">
                                                      签章启动前将进行智能稽核
                                                  </div>
                                              )}
                                          </div>

                                          {/* CA 证书卡片 */}
                                          <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                              <h4 className="font-bold text-slate-800 border-b border-slate-100 pb-3 mb-4 flex items-center gap-2"><ShieldCheck size={16} className="text-emerald-500"/> CA 证书状态</h4>
                                              {signStep >= 2 ? (
                                                  <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-lg animate-in fade-in">
                                                      <div className="flex items-center gap-2 text-emerald-700 font-bold mb-2"><ShieldCheck size={16}/> 硬件 UKey 已读取</div>
                                                      <div className="text-xs text-emerald-700 space-y-1.5 opacity-90">
                                                          <div className="font-bold border-b border-emerald-200/50 pb-1 mb-1">主体: {currentRole.name}</div>
                                                          <div>颁发机构: 国家电子认证中心 (CFCA)</div>
                                                          <div>加密算法: SM2 国密算法</div>
                                                          <div>有效期至: 2027-12-31</div>
                                                      </div>
                                                  </div>
                                              ) : (
                                                  <div className="bg-slate-50 border border-slate-200 p-3 rounded-lg text-slate-500 flex flex-col items-center justify-center py-6">
                                                      <Key size={24} className="mb-2 opacity-30"/>
                                                      <span className="text-xs font-medium">请插入或等待读取物理 UKey 设备</span>
                                                  </div>
                                              )}
                                          </div>

                                          {/* 操作按钮区 */}
                                          <div className="mt-auto">
                                              <button onClick={handleSign} disabled={signStep > 0} className={`w-full py-4 rounded-xl shadow-xl font-bold flex justify-center items-center gap-2 hover:opacity-90 active:scale-95 transition-all duration-300 disabled:scale-100 disabled:opacity-100 ${signStep === 0 ? 'bg-red-600 text-white hover:shadow-red-500/30' : signStep === 1 ? 'bg-indigo-600 text-white' : signStep === 2 ? 'bg-amber-500 text-white' : signStep === 4 ? 'bg-emerald-600 text-white' : 'bg-red-500 text-white'}`}>
                                                  {signStep === 0 && <><Key size={18}/> 启动安全签署序列</>}
                                                  {signStep === 1 && <><Fingerprint size={18} className="animate-pulse"/> AI 校验文件一致性...</>}
                                                  {signStep === 2 && <><Key size={18} className="animate-bounce"/> UKey 认证中 (读取中)</>}
                                                  {signStep === 3 && <><RefreshCw size={18} className="animate-spin"/> 正在加盖电子印章...</>}
                                                  {signStep === 4 && <><CheckCircle2 size={18}/> 签批成功，已落块存证</>}
                                              </button>
                                          </div>
                                      </div>
                                  </div>
                              ) : (
                                  <div className="text-slate-400 font-bold flex flex-col items-center opacity-50">
                                      <FileSignature size={80} className="mb-6 text-slate-300"/>
                                      <span className="text-lg">请在左侧选择文件进行在线签署</span>
                                  </div>
                              )}
                          </div>
                      </div>
                  </div>
              );
          };

          const renderContent = () => {
            switch(activeMenu) {
              case 'dashboard-main': return renderDashboardMain();
              case 'sov-manage': return renderSovManage();
              case 'field-inspect': return renderFieldInspect();
              case 'joint-approval': return renderJointApproval();
              case 'doc-ssot': return renderDocSsot();
              case 'rfi-manage': return renderRfiManage();
              case 'change-trace': return renderChangeTrace();
              case 'e-signature': return renderESignature();
              default: return (
                <div className="flex flex-col items-center justify-center h-[500px] bg-white rounded-lg border border-dashed border-slate-200 text-slate-400 animate-in fade-in duration-300">
                  <LayoutDashboard size={48} className="mb-2 opacity-30"/>
                  <p className="font-bold">模块：{MENU_DATA.flatMap(m => m.subMenus).find(s => s.id === activeMenu)?.title}</p>
                  <p className="text-xs mt-2">此核心业务子模块正在进行数据穿透配置...</p>
                </div>
              );
            }
          };

          return (
            <div className="flex h-screen bg-slate-100 font-sans overflow-hidden text-slate-900 relative">
              {toast && (
                <div className="fixed top-6 left-1/2 -translate-x-1/2 md:left-auto md:translate-x-0 md:right-6 z-[200] animate-in slide-in-from-top-4 fade-in duration-300 w-[90%] md:w-auto max-w-md">
                  <div className="bg-green-600 text-white px-5 py-4 rounded-lg shadow-xl flex items-start gap-3">
                    <CheckCircle2 className="shrink-0 mt-0.5 text-green-100" size={20} />
                    <div className="flex-1 text-sm font-medium whitespace-pre-line leading-relaxed">{toast}</div>
                    <button onClick={() => setToast(null)} className="shrink-0 p-1 hover:bg-green-700 rounded transition-colors text-green-100 hover:text-white"><X size={16} /></button>
                  </div>
                </div>
              )}

              <aside className={`${isSidebarOpen ? 'w-64 lg:w-72' : 'w-0 -translate-x-full'} absolute md:relative transition-all duration-300 ease-in-out bg-slate-900 text-slate-300 flex flex-col z-30 shadow-2xl shrink-0 h-full`}>
                <div className="h-16 flex items-center px-5 bg-slate-950 text-white shrink-0 border-b border-slate-800">
                  <Building2 className="text-blue-500 mr-3 shrink-0" size={24} />
                  <span className="font-bold text-lg tracking-wide truncate">工程管理云</span>
                </div>
                
                <div className="flex-1 overflow-y-auto py-4 scrollbar-thin scrollbar-thumb-slate-700">
                  <nav className="space-y-1 px-3">
                    {MENU_DATA.map(menu => (
                      <div key={menu.id} className="mb-2">
                        <button onClick={() => toggleMenu(menu.id)} className="w-full flex items-center justify-between px-3 py-2.5 rounded-md hover:bg-slate-800 hover:text-white transition-colors group">
                          <div className="flex items-center gap-3">
                            <menu.icon size={18} className={`${expandedMenus.includes(menu.id) ? 'text-blue-400' : 'text-slate-500 group-hover:text-slate-300'}`} />
                            <div className="text-left">
                              <span className="font-bold text-sm block leading-tight">{menu.title}</span>
                              <span className="text-[9px] text-slate-500 hidden xl:block opacity-60 mt-0.5">{menu.desc}</span>
                            </div>
                          </div>
                          <ChevronDown size={14} className={`shrink-0 transition-transform duration-200 ${expandedMenus.includes(menu.id) ? 'rotate-180 text-blue-400' : 'text-slate-600'}`} />
                        </button>
                        <div className={`overflow-hidden transition-all duration-300 ${expandedMenus.includes(menu.id) ? 'max-h-[400px] opacity-100 mt-1 mb-2' : 'max-h-0 opacity-0'}`}>
                          {menu.subMenus.map(sub => (
                            <button 
                              key={sub.id} 
                              onClick={() => {
                                setActiveMenu(sub.id);
                                if(window.innerWidth < 768) setIsSidebarOpen(false);
                              }} 
                              className={`w-full flex items-center pl-10 pr-3 py-2 text-xs rounded transition-all ${activeMenu === sub.id ? 'bg-blue-600/20 text-blue-400 font-bold border-l-2 border-blue-400 ml-1' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}
                            >
                              {sub.title}
                            </button>
                          ))}
                        </div>
                      </div>
                    ))}
                  </nav>
                </div>
              </aside>

              {isSidebarOpen && <div className="fixed inset-0 bg-slate-900/50 z-20 md:hidden" onClick={() => setIsSidebarOpen(false)} />}

              <div className="flex-1 flex flex-col w-full min-w-0 relative h-full">
                <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:px-6 shrink-0 shadow-sm z-10">
                  <div className="flex items-center gap-4">
                    <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-1 rounded-md hover:bg-slate-100 text-slate-600 transition-colors"><Menu size={20} /></button>
                    <div className="hidden sm:block">
                      <span className="text-sm font-bold text-slate-800 block text-left">雅下水电站建设项目</span>
                      <span className="text-[10px] text-slate-500 font-medium bg-slate-100 px-1.5 rounded">全周期业财一体监管</span>
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-2 lg:gap-6">
                    <div className="bg-slate-100 border border-slate-200 rounded-full p-1 flex items-center shadow-inner pr-2">
                      <div className="relative group">
                        <button className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm transition-all border ${currentRole.color} border-opacity-30`}>
                          <UserCircle size={14} className="shrink-0" />
                          <span className="max-w-[80px] sm:max-w-none truncate">{currentRole.name.split(' ')[0]}</span>
                          <ChevronDown size={12} className="opacity-50 shrink-0" />
                        </button>
                        <div className="absolute right-0 mt-2 w-64 sm:w-72 bg-white rounded-xl shadow-2xl border border-slate-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 overflow-hidden">
                          <div className="bg-slate-50 px-4 py-3 border-b border-slate-100 text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center">切换体验不同角色的监管权限</div>
                          <div className="py-2 max-h-[60vh] overflow-y-auto">
                            {ROLES.map(role => (
                              <button key={role.id} onClick={() => setCurrentRole(role)} className={`w-full text-left px-4 py-3 hover:bg-slate-50 border-l-4 transition-all flex flex-col gap-1 ${currentRole.id === role.id ? 'border-blue-500 bg-blue-50/50' : 'border-transparent'}`}>
                                <span className={`text-xs font-bold ${currentRole.id === role.id ? 'text-blue-700' : 'text-slate-800'}`}>{role.name}</span>
                                <span className="text-[10px] text-slate-400 leading-tight hidden sm:block">{role.desc}</span>
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>
                    </div>
                    <div className="flex items-center gap-2 text-slate-400">
                       <div className="hidden sm:block h-6 w-px bg-slate-200 mx-2"></div>
                       <div className="relative p-2 rounded-full hover:bg-slate-100 cursor-pointer transition-colors">
                          <Bell size={20}/>
                          <span className="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                       </div>
                    </div>
                  </div>
                </header>

                <main className="flex-1 overflow-y-auto p-4 lg:p-8 bg-slate-100 scrollbar-thin flex flex-col">
                  <div className="max-w-[1400px] w-full mx-auto space-y-6 flex-1 flex flex-col min-h-0">
                    <div className="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider overflow-x-auto whitespace-nowrap pb-1 scrollbar-none shrink-0">
                       <span>工程管理云</span>
                       <ChevronRight size={10} className="shrink-0"/>
                       <span>{MENU_DATA.find(m => m.subMenus.some(s => s.id === activeMenu))?.title}</span>
                       <ChevronRight size={10} className="shrink-0"/>
                       <span className="text-blue-600">{MENU_DATA.flatMap(m => m.subMenus).find(s => s.id === activeMenu)?.title}</span>
                    </div>
                    {renderContent()}
                  </div>
                </main>

                {viewerData && (
                  <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200 max-h-[90vh]">
                      <div className="flex items-center justify-between px-4 sm:px-6 py-4 border-b bg-slate-50 shrink-0">
                        <h3 className="font-bold text-slate-800 flex items-center gap-2 text-sm sm:text-base">
                          {viewerData.type === 'image' ? <Camera size={20} className="text-blue-500 shrink-0"/> : <FileBadge size={20} className="text-purple-500 shrink-0"/>}
                          <span className="truncate">{viewerData.title}</span>
                        </h3>
                        <button onClick={() => setViewerData(null)} className="p-2 rounded-full hover:bg-slate-200 text-slate-500 transition-colors shrink-0"><X size={20}/></button>
                      </div>
                      
                      <div className="p-6 sm:p-10 bg-slate-200/50 flex flex-col items-center justify-center overflow-y-auto flex-1 min-h-[300px] sm:min-h-[500px]">
                        {viewerData.type === 'image' ? (
                          viewerData.url ? (
                              <div className="border-[8px] sm:border-[12px] border-white shadow-2xl bg-slate-300 w-full h-[300px] sm:h-[400px] flex flex-col items-center justify-center text-slate-500 rounded-xl relative overflow-hidden group">
                                <img src={viewerData.url} alt="现场实景" className="w-full h-full object-cover" />
                                <div className="absolute bottom-4 right-4 bg-black/60 text-white text-[10px] px-2 py-1 rounded backdrop-blur-md border border-white/20">水印：2026-05-17 14:20 GPS已存证</div>
                              </div>
                          ) : (
                              <div className="border-[8px] sm:border-[12px] border-white shadow-2xl bg-slate-300 w-full h-[300px] sm:h-[400px] flex flex-col items-center justify-center text-slate-500 rounded-xl relative overflow-hidden group">
                                <Camera size={64} className="mb-4 opacity-10"/>
                                <p className="font-bold text-base sm:text-lg">工程现场实景照片库</p>
                                <p className="text-[10px] mt-2 opacity-50 bg-black/10 px-2 py-1 rounded">水印：2026-05-17 14:20 GPS已存证</p>
                              </div>
                          )
                        ) : (
                          <div className="bg-white border shadow-xl w-[90%] sm:w-4/5 py-12 sm:h-[450px] flex flex-col items-center justify-center text-slate-500 rounded-lg relative px-6 sm:px-12">
                            <FileBadge size={72} className="mb-6 opacity-10 text-purple-600 hidden sm:block"/>
                            <p className="text-slate-700 font-bold text-lg sm:text-xl tracking-widest sm:tracking-[0.3em] uppercase text-center">工程电子凭证预览</p>
                            <div className="mt-8 sm:mt-12 w-full space-y-4 opacity-20">
                              <div className="h-4 bg-slate-200 rounded w-full"></div>
                              <div className="h-4 bg-slate-200 rounded w-3/4"></div>
                              <div className="h-4 bg-slate-200 rounded w-full"></div>
                              <div className="h-4 bg-slate-200 rounded w-1/2"></div>
                            </div>
                            <div className="absolute top-4 sm:top-10 right-4 sm:right-10 flex flex-col items-center border-2 border-red-500/20 p-2 rounded-full rotate-12 scale-75 sm:scale-100">
                               <ShieldAlert size={40} className="text-red-500/20"/>
                               <span className="text-[8px] text-red-500/20 font-bold mt-1">验评专用</span>
                            </div>
                            <div className="absolute bottom-4 sm:bottom-10 right-4 sm:right-10 border-4 border-red-500/20 text-red-500/20 font-black text-xl sm:text-3xl px-4 sm:px-6 py-2 rotate-[-15deg] rounded-lg tracking-widest opacity-80">
                              数字签章存证
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="bg-slate-50 px-4 sm:px-6 py-4 border-t flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shrink-0">
                        <div className="flex flex-col items-start w-full sm:w-auto">
                           <div className="flex items-center gap-1.5 text-xs text-slate-500 font-bold">
                             <ShieldAlert size={14} className="text-blue-500"/> 哈希摘要: 0x8a92...f7b2
                           </div>
                           <span className="text-[10px] text-slate-400 mt-1 break-all">此附件已通过区块链存证，支持全穿透审计。</span>
                        </div>
                        <button onClick={() => setViewerData(null)} className="w-full sm:w-auto px-6 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-bold text-xs transition-colors shadow-sm">关闭查阅</button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
