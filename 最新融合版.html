<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程管理云平台 - 智能业财全流程版</title>
    
    <!-- 引入高清无衬线字体 (Inter) 以解决渲染模糊问题 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 引入 Tailwind CSS 实时编译核心 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 配置 Tailwind 启用高清字体 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <!-- 引入 Babel 编译器以支持浏览器端的 JSX 语法 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 全局字体渲染优化：强制抗锯齿与高清晰度渲染 */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* 动画效果 */
        .animate-in { animation-fill-mode: both; }
        .fade-in { animation-name: fadeIn; }
        .slide-in-from-top-4 { animation-name: slideInTop; }
        .slide-in-from-bottom-2 { animation-name: slideInBottom; }
        .zoom-in-95 { animation-name: zoomIn; }
        .duration-200 { animation-duration: 200ms; }
        .duration-300 { animation-duration: 300ms; }
        .duration-500 { animation-duration: 500ms; }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes slideInTop { 
            from { transform: translateY(-1rem) translateX(-50%); opacity: 0; } 
            to { transform: translateY(0) translateX(-50%); opacity: 1; } 
        }
        @keyframes slideInBottom { 
            from { transform: translateY(0.5rem); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }
        @media (min-width: 768px) {
            @keyframes slideInTop {
                from { transform: translateY(-1rem); opacity: 0; } 
                to { transform: translateY(0); opacity: 1; } 
            }
        }
        @keyframes zoomIn { 
            from { transform: scale(0.95); opacity: 0; } 
            to { transform: scale(1); opacity: 1; } 
        }

        /* 扫描线动画 */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #8b5cf6;
            box-shadow: 0 0 10px #8b5cf6, 0 0 5px #8b5cf6;
            animation: scan 1.5s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* 垂直大面积激光扫描动画 (BIM核实专用) */
        .scan-line-vertical {
            animation: scanVertical 2.5s ease-in-out infinite alternate;
        }
        @keyframes scanVertical {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* BIM 线框化滤镜 */
        .bim-wireframe {
            filter: sepia(1) hue-rotate(180deg) saturate(200%) brightness(0.8) contrast(1.5) invert(0.2);
            mix-blend-mode: screen;
            opacity: 0.85;
        }
        
        /* 水位线进度条条纹 */
        .bg-stripes {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }

        .typing-dot::after {
            content: '...';
            animation: typing 1.5s infinite step-start;
        }
        @keyframes typing { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    </style>
</head>
<body class="bg-slate-100 antialiased overflow-hidden text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, Fragment } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        import { 
          LayoutDashboard, Calculator, FileText, Building2, ShieldAlert, ChevronDown, ChevronRight,
          Bell, Search, UserCircle, CheckCircle2, XCircle, Clock, ArrowRightLeft, AlertTriangle, Menu, X,
          HardHat, Link2, Mail, GitMerge, Users, Camera, Archive, Lock, FileCheck2, Stamp, SendToBack,
          Eye, Wallet, Activity, Layers, PenTool, ClipboardList, MapPin, Landmark, History, FileBadge,
          BarChart3, TrendingUp, CheckSquare, MessageSquare, FileWarning, ArrowUpRight, ArrowDownRight,
          PieChart, Inbox, FileSignature, FolderTree, Info, Scan, Plus, Trash2, Paperclip, FileCheck, ShieldCheck, Sparkles, Bot, Zap, Image as ImageIcon, Video, RefreshCw,
          ActivitySquare, ArrowDown, ArrowRight, ArrowUpCircle, Box, Download, FilePlus, FileSearch, FileSpreadsheet, FileUp, Filter, Fingerprint, GitCommit, Key, MessageCircle, Play, PlayCircle, Send, UploadCloud, Wand2
        } from 'https://esm.sh/lucide-react@0.292.0';

        // ================= 基础配置与常量 =================
        const iconPdf = "M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z";
        const iconImg = "M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z";
        const iconXlsx = "M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z";
        const iconUpload = "M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12";

        const imgDam = "https://images.unsplash.com/photo-1541888081622-1f414cb207cc?auto=format&fit=crop&q=80&w=800"; 
        const imgRebar = "https://images.unsplash.com/photo-1590644365607-1c5a392275ce?auto=format&fit=crop&q=80&w=800"; 

        const SvgIcon = ({ d, className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={d} /></svg>
        );

        const SparklesIcon = ({ className="w-4 h-4" }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2l1.3 4.2 4.7 1.3-3.6 3.1 1.1 4.4-4.5-2.6-4.5 2.6 1.1-4.4-3.6-3.1 4.7-1.3L10 2z" /></svg>
        );

        const AIIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L13.065 8.935L20 10L13.065 11.065L12 18L10.935 11.065L4 10L10.935 8.935L12 2Z" />
                <path d="M19 16L19.5325 19.4675L23 20L19.5325 20.5325L19 24L18.4675 20.5325L15 20L18.4675 19.4675L19 16Z" opacity="0.6"/>
                <path d="M5 16L5.5325 19.4675L9 20L5.5325 20.5325L5 24L4.4675 20.5325L1 20L4.4675 19.4675L5 16Z" opacity="0.6"/>
            </svg>
        );

        const mockUploadData = {
            '10': [{name: '混凝土浇筑准入证.pdf', id: 'pdf', icon: iconPdf, color: 'text-red-500'}, {name: '仓面验收全景图.jpg', id: 'image', icon: iconImg, color: 'text-blue-500'}],
            '10.1': [{name: '商混电子出票单(合集).pdf', id: 'pdf', icon: iconPdf, color: 'text-red-500'}, {name: '商混入仓现场抓拍.jpg', id: 'image', icon: iconImg, color: 'text-blue-500'}],
            '10.2': [{name: '钢筋过磅单及质检单.pdf', id: 'pdf', icon: iconPdf, color: 'text-red-500'}, {name: '钢筋隐蔽工程照片.jpg', id: 'image', icon: iconImg, color: 'text-blue-500'}],
            '10.3': [{name: '塔机物联运转记录.xlsx', id: 'pdf', icon: iconXlsx, color: 'text-green-500'}],
            '10.4': [{name: '班组门禁考勤表.pdf', id: 'pdf', icon: iconPdf, color: 'text-red-500'}]
        };

        const ROLES = [
          { id: 'owner', name: '建设单位 (项目总控)', desc: '控制总投资，终审资料并授权发证', color: 'bg-blue-100 text-blue-800' },
          { id: 'contractor', name: '施工单位', desc: '提交产值(SOV)，发起资金申报', color: 'bg-orange-100 text-orange-800' },
          { id: 'consultant', name: '监理单位', desc: '现场见证，核定量价，出具支付证书', color: 'bg-purple-100 text-purple-800' },
          { id: 'bank', name: '金融机构 (放款银行)', desc: '凭证书接收指令，执行资金划拨', color: 'bg-green-100 text-green-800' },
          { id: 'regulator', name: '监管机构 (政府/住建)', desc: '全局穿透审计，合规与防挪用监控', color: 'bg-slate-200 text-slate-800' },
        ];

        // 重新排序后的 MENU_DATA，符合 规划 -> 执行 -> 结算 -> 支撑 -> 收尾 的全周期逻辑
        const MENU_DATA = [
          {
            id: 'dashboard', icon: LayoutDashboard, title: '监管大盘', desc: '全局穿透视界', 
            subMenus: [ 
              { id: 'dashboard-main', title: '业财全景' }, 
              { id: 'dashboard-gis', title: '资金沙盘' },
              { id: 'dashboard-risk', title: '风险预警中心' },
              { id: 'dashboard-perform', title: '履约进度分析' }
            ]
          },
          {
            id: 'budget', icon: Calculator, title: '投资概算', desc: '防超概红线',
            subMenus: [ 
              { id: 'budget-wbs', title: '目标概算(CBS)' }, 
              { id: 'budget-plan', title: '月/年资金计划' },
              { id: 'budget-eac', title: '动态预测(EAC)' },
              { id: 'budget-pool', title: '变更备用金池' }
            ]
          },
          {
            id: 'contract', icon: FileText, title: '合同产值', desc: '业财转化枢纽', 
            subMenus: [ 
              { id: 'contract-ledger', title: '合同台账总表' }, 
              { id: 'sov-manage', title: '当期产值报审' },
              { id: 'visa-manage', title: '工程签证/VO' },
              { id: 'labor-manage', title: '劳务实名台账' }
            ]
          },
          {
            id: 'field', icon: HardHat, title: '现场品控', desc: '支付前置约束', 
            subMenus: [ 
              { id: 'field-inspect', title: '形象进度查勘' }, 
              { id: 'bim-viewer', title: 'BIM模型量测' }, 
              { id: 'defect-track', title: '缺陷与罚扣款' },
              { id: 'safety-audit', title: '现场安全检查' }
            ]
          },
          {
            id: 'payment', icon: FileCheck2, title: '合同支付', desc: '业财联审流', 
            subMenus: [ 
              { id: 'joint-approval', title: '进度款联审' },
              { id: 'advance-payout', title: '预付款/材料款' },
              { id: 'retention-payout', title: '质保金/尾款' },
              { id: 'cert-archive', title: '支付证书库' }
            ]
          },
          {
            id: 'fund', icon: Building2, title: '银企直连', desc: '物理资金划拨', 
            subMenus: [ 
              { id: 'account-manage', title: '专户资金监测' }, 
              { id: 'fund-transfer', title: '划拨指令下达' },
              { id: 'fund-history', title: '流水自动对账' },
              { id: 'fund-freeze', title: '资金冻结/解冻' }
            ]
          },
          {
            id: 'collab', icon: Layers, title: '资料协同', desc: '全业务流转中心', 
            subMenus: [ 
              { id: 'doc-ssot', title: '验评与图文 (SSOT)' }, 
              { id: 'rfi-manage', title: '通信 RFI / 联办' },
              { id: 'change-trace', title: '变更溯源证据链' },
              { id: 'e-signature', title: '在线签章 / CA' } 
            ]
          },
          {
            id: 'handover', icon: ShieldAlert, title: '交付审计', desc: '穿透防伪闭环', 
            subMenus: [ 
              { id: 'completion-audit', title: '竣工决算审计' }, 
              { id: 'audit-log', title: '区块链审计日志' },
              { id: 'digital-transfer', title: '数字化移交册' }
            ]
          }
        ];

        // ================= 子组件 =================

        // ================= 公共子组件 =================

        // 垂直流程节点组件
        const FlowNode = ({ title, desc, role, status, isLast, actionBtn }) => {
            const isActive = status === 'active';
            const isDone = status === 'done';
            const isReject = status === 'reject';
            
            return (
                <div className="flex flex-col items-center w-full relative">
                    <div className={`w-[95%] rounded-lg p-4 border transition-all relative z-10 ${isDone ? 'bg-emerald-50 border-emerald-200' : isReject ? 'bg-red-50 border-red-200 shadow-sm' : isActive ? 'bg-blue-50 border-blue-400 shadow-[0_0_10px_rgba(59,130,246,0.3)] ring-2 ring-blue-100' : 'bg-slate-50 border-slate-200 opacity-60'}`}>
                        <div className="flex justify-between items-start mb-2.5">
                            <div className="flex items-center gap-2">
                                {isDone ? <CheckCircle2 size={16} className="text-emerald-500 shrink-0"/> : isReject ? <XCircle size={16} className="text-red-500 shrink-0"/> : isActive ? <RefreshCw size={16} className="text-blue-500 animate-spin shrink-0"/> : <Clock size={16} className="text-slate-400 shrink-0"/>}
                                <span className={`font-bold text-sm leading-tight ${isDone ? 'text-emerald-800' : isReject ? 'text-red-800' : isActive ? 'text-blue-800' : 'text-slate-500'}`}>{title}</span>
                            </div>
                            {isDone && <span className="text-[10px] text-emerald-600 font-mono shrink-0">14:00 录入</span>}
                        </div>
                        <div className="text-[11px] text-slate-600 mb-3 leading-relaxed">{desc}</div>
                        <div className="flex justify-between items-center border-t border-slate-200/60 pt-2.5">
                            <span className="text-[10px] font-bold bg-white px-2 py-0.5 rounded border border-slate-200 text-slate-500 flex items-center gap-1.5"><UserCircle size={12}/> {role}</span>
                        </div>
                        {(isActive || isReject) && actionBtn && (
                            <div className={`mt-3.5 border-t pt-3.5 animate-in fade-in ${isReject ? 'border-red-200/50' : 'border-blue-200/50'}`}>
                                {actionBtn}
                            </div>
                        )}
                    </div>
                    {!isLast && (
                        <div className="my-0.5 flex flex-col items-center justify-center h-6 w-full relative z-0">
                            <div className={`w-0.5 h-full ${isDone ? 'bg-emerald-400' : isReject ? 'bg-red-400' : 'bg-slate-200'} relative`}></div>
                            <ArrowDown size={14} className={`absolute -bottom-2 -left-[6px] ${isDone ? 'text-emerald-400' : isReject ? 'text-red-400' : 'text-slate-300'}`}/>
                        </div>
                    )}
                </div>
            );
        };

        // 包含 AI 解析流程的文件上传组件 (SSOT专用)
        const UploadDocumentModal = ({ isOpen, onClose, onSubmit, editDoc }) => {
            const [uploadState, setUploadState] = useState('idle'); // idle, file_selected, parsing, ready, submitting
            const [formData, setFormData] = useState({ name: '', discipline: '', type: 'doc', desc: '' });

            useEffect(() => {
                if (isOpen && editDoc) { 
                    setFormData({ name: editDoc.name, discipline: editDoc.discipline, type: editDoc.type, desc: '' }); 
                    setUploadState('ready');
                } else if (isOpen) { 
                    setFormData({ name: '', discipline: '', type: 'doc', desc: '' }); 
                    setUploadState('idle');
                }
            }, [isOpen, editDoc]);

            if (!isOpen) return null;
            const isNewVersion = !!editDoc;
            const newVersionNum = isNewVersion ? `V${(parseFloat(editDoc.version.replace('V', '')) + 1).toFixed(1)}` : 'V1.0';

            const handleFileSelect = () => {
                if (isNewVersion) return; 
                setUploadState('file_selected');
            };

            const triggerAIParsing = () => {
                setUploadState('parsing');
                setTimeout(() => {
                    setFormData({
                        name: '地下室机房设备基础预留预埋图纸',
                        discipline: '机电',
                        type: 'model',
                        desc: ''
                    });
                    setUploadState('ready');
                }, 2000);
            };

            const handleSubmit = () => {
                setUploadState('submitting');
                setTimeout(() => { onSubmit(formData, newVersionNum); }, 1000);
            };

            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
                    <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
                        <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center shrink-0">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                {isNewVersion ? <RefreshCw size={18} className="text-blue-500"/> : <UploadCloud size={18} className="text-blue-500"/>}
                                {isNewVersion ? '更新版本资料 (Revise)' : '起草新工程资料'}
                            </h3>
                            <button onClick={onClose} className="p-1 hover:bg-slate-200 rounded-md text-slate-500 transition-colors"><X size={18}/></button>
                        </div>
                        <div className="p-6 flex-1 overflow-y-auto">
                            
                            {/* 上传拖拽区或文件选中区 */}
                            {uploadState === 'idle' ? (
                                <div onClick={handleFileSelect} className="border-2 border-dashed border-blue-200 bg-blue-50/50 rounded-xl p-6 mb-6 text-center hover:bg-blue-50 hover:border-blue-400 transition-all cursor-pointer flex flex-col items-center justify-center">
                                    <FileUp size={40} className="text-blue-400 mb-3"/>
                                    <p className="font-bold text-slate-700 text-sm mb-1">点击选择本地文件</p>
                                    <p className="text-xs text-slate-500">支持 PDF, DWG 等格式</p>
                                </div>
                            ) : !isNewVersion && (
                                <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 mb-6 flex flex-col items-center justify-center relative overflow-hidden">
                                    <div className="flex items-center gap-3 w-full border-b border-indigo-100 pb-3 mb-3">
                                        <div className="p-2 bg-white rounded shadow-sm"><FileText size={20} className="text-indigo-500"/></div>
                                        <div className="min-w-0 flex-1">
                                            <div className="font-bold text-sm text-indigo-900 truncate">MEP_Underground_v1.dwg</div>
                                            <div className="text-xs text-indigo-500">14.2 MB</div>
                                        </div>
                                        {uploadState === 'ready' && <CheckCircle2 size={20} className="text-emerald-500"/>}
                                    </div>
                                    
                                    {uploadState === 'file_selected' && (
                                        <button onClick={triggerAIParsing} className="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-bold shadow hover:bg-indigo-700 flex justify-center items-center gap-2 animate-in zoom-in transition-all">
                                            <Sparkles size={16}/> 启动 AI 图纸/文档智能解析
                                        </button>
                                    )}
                                    {uploadState === 'parsing' && (
                                        <div className="w-full text-indigo-600 py-1 text-sm font-bold flex flex-col items-center justify-center gap-2">
                                            <RefreshCw size={20} className="animate-spin mb-1"/>
                                            <span className="typing-dot font-mono text-xs">大模型正在抽取标题及图框属性</span>
                                        </div>
                                    )}
                                    {uploadState === 'ready' && (
                                        <div className="w-full text-emerald-600 text-xs font-bold text-center bg-emerald-50 py-1.5 rounded flex items-center justify-center gap-1.5 border border-emerald-100">
                                            <Bot size={14}/> AI 抽取完毕，已自动填充下方表单
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* 动态表单 */}
                            <div className={`space-y-4 transition-opacity duration-500 ${uploadState === 'ready' || isNewVersion ? 'opacity-100' : 'opacity-30 pointer-events-none'}`}>
                                {isNewVersion && (
                                    <div className="bg-blue-50 p-3 rounded border border-blue-100 flex justify-between items-center text-sm mb-4">
                                        <span className="text-slate-600 font-bold">目标版本变更:</span>
                                        <div className="flex items-center gap-2 font-mono font-bold">
                                            <span className="text-slate-400 line-through">{editDoc.version}</span>
                                            <ArrowRight size={14} className="text-blue-500"/>
                                            <span className="text-blue-600 bg-white px-2 py-0.5 rounded shadow-sm">{newVersionNum}</span>
                                        </div>
                                    </div>
                                )}
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1">文档标题 <span className="text-red-500">*</span> {uploadState==='ready'&&!isNewVersion&&<Sparkles size={10} className="text-indigo-500"/>}</label>
                                    <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm"/>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1">所属专业 {uploadState==='ready'&&!isNewVersion&&<Sparkles size={10} className="text-indigo-500"/>}</label>
                                        <select value={formData.discipline} onChange={(e) => setFormData({...formData, discipline: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white">
                                            <option value="">请选择...</option>
                                            <option value="土建">土建 (CIV)</option><option value="机电">机电 (MEP)</option><option value="安全">安全 (HSE)</option><option value="质量">质量 (QAL)</option><option value="测绘">测绘 (SUR)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">资料类型</label>
                                        <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white">
                                            <option value="doc">文档卷册</option><option value="model">图纸模型</option><option value="image">现场影像</option><option value="video">音视频</option><option value="form">验评表单</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5">修改/分发说明</label>
                                    <textarea value={formData.desc} onChange={(e) => setFormData({...formData, desc: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm resize-none h-16" placeholder="请简要描述发版目的或修改点..."></textarea>
                                </div>
                            </div>
                        </div>
                        <div className="bg-slate-50 px-6 py-4 border-t border-slate-200 flex justify-end gap-3 shrink-0">
                            <button onClick={onClose} disabled={uploadState === 'submitting'} className="px-5 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg font-bold text-xs">取消</button>
                            <button onClick={handleSubmit} disabled={uploadState !== 'ready' || !formData.name || !formData.discipline} className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-xs shadow-md flex items-center gap-2 disabled:opacity-50 transition-colors">
                                {uploadState === 'submitting' ? <RefreshCw size={14} className="animate-spin"/> : <CheckCircle2 size={14}/>}
                                {uploadState === 'submitting' ? '处理中...' : (isNewVersion ? '确认升版并流转' : '保存文档草稿')}

                        </div>
                    </div>
                </div>
            );
        };

        // 发起 RFI 弹窗 (带 AI 辅助)
        const CreateRfiModal = ({ isOpen, onClose, onSubmit }) => {
            const [subject, setSubject] = useState('');
            const [text, setText] = useState('');
            const [isAiSuggesting, setIsAiSuggesting] = useState(false);

            if (!isOpen) return null;

            const triggerAiSuggest = () => {
                setIsAiSuggesting(true);
                setTimeout(() => {
                    setSubject('紧急：地下室管线与结构标高冲突确认');
                    setText('现场开挖后发现，A区地下室原设计管线标高与实际岩层标高存在严重冲突。若按原图纸施工，主引水管将无法穿过承重梁。由于后天需封模打混凝土，请设计与监理单位紧急核实并给出调整指导意见，避免大面积返工。');
                    setIsAiSuggesting(false);
                }, 1500);
            };

            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in">
                    <div className="bg-white w-full max-w-xl rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95">
                        <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center shrink-0">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><Plus size={18} className="text-blue-500"/> 发起新 RFI 函件</h3>
                            <button onClick={onClose} className="p-1 hover:bg-slate-200 rounded-md text-slate-500 transition-colors"><X size={18}/></button>
                        </div>
                        <div className="p-6 flex-1 space-y-4">
                            <button onClick={triggerAiSuggest} disabled={isAiSuggesting} className="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors mb-2">
                                {isAiSuggesting ? <RefreshCw size={16} className="animate-spin"/> : <Sparkles size={16}/>}
                                {isAiSuggesting ? 'AI 正在分析您的图纸并撰写描述...' : 'AI 辅助快速起草 RFI'}
                            </button>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1.5">主题 (Subject) *</label>
                                <input type="text" value={subject} onChange={e=>setSubject(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm" placeholder="一句话概括问题核心..."/>
                            </div>
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5">优先级</label>
                                    <select className="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white"><option>高 (High)</option><option>中 (Normal)</option><option>低 (Low)</option></select>
                                </div>
                                <div className="flex-1">
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5">期望回复时间</label>
                                    <input type="date" className="w-full px-3 py-2 border border-slate-300 rounded text-sm"/>
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1.5">疑问详细描述</label>
                                <textarea value={text} onChange={e=>setText(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded text-sm resize-none h-32" placeholder="请详细描述需要澄清或确认的技术问题..."></textarea>
                            </div>
                        </div>
                        <div className="bg-slate-50 px-6 py-4 border-t border-slate-200 flex justify-end gap-3 shrink-0">
                            <button onClick={onClose} className="px-5 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg font-bold text-sm">取消</button>
                            <button onClick={()=>{ onSubmit(subject, text); onClose(); }} disabled={!subject || !text} className="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold text-sm shadow flex items-center gap-2 disabled:opacity-50">
                                <Send size={14}/> 发送 RFI
                            </button>
                        </div>
                    </div>
                </div>
            );
        };


        // ================= 核心 App 应用 =================
        // 1. SOV AI 凭证提取弹窗
        const SovAiExtractModal = ({ isOpen, onClose, onConfirm }) => {
            const [aiPhase, setAiPhase] = useState(0); 
            const [mockUploadedFiles, setMockUploadedFiles] = useState([]);
            
            useEffect(() => {
                if (isOpen) { setAiPhase(0); setMockUploadedFiles([]); }
            }, [isOpen]);

            const handleUploadFiles = () => {
                setAiPhase(1); 
                setTimeout(() => {
                    setMockUploadedFiles([
                        { name: '混凝土浇筑准入证.pdf', id: 'cert', icon: iconPdf, color: 'text-red-500' },
                        { name: '仓面验收全景图.jpg', id: 'image', icon: iconImg, color: 'text-blue-500' },
                        { name: '商混电子出票单(合集).pdf', id: 'concrete', icon: iconPdf, color: 'text-red-500' },
                        { name: '商混入仓现场抓拍.jpg', id: 'image', icon: iconImg, color: 'text-blue-500' },
                        { name: '钢筋过磅单及质检单.pdf', id: 'rebar', icon: iconPdf, color: 'text-red-500' },
                        { name: '钢筋隐蔽工程照片.jpg', id: 'image', icon: iconImg, color: 'text-blue-500' },
                        { name: '塔机物联运转记录.xlsx', id: 'machine', icon: iconXlsx, color: 'text-green-500' },
                        { name: '班组门禁考勤表.pdf', id: 'labor', icon: iconPdf, color: 'text-red-500' }
                    ]);
                    setAiPhase(2); 
                }, 800);
            };

            const handleStartAnalysis = () => {
                setAiPhase(3);
                setTimeout(() => setAiPhase(4), 3000);
            };

            if (!isOpen) return null;
            return (
                <div className="absolute inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white w-[90%] max-w-[900px] rounded-xl shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200 border border-slate-300">
                        <div className="bg-gradient-to-r from-indigo-900 to-purple-800 border-b border-indigo-700 px-5 py-4 flex justify-between items-center">
                            <h3 className="font-bold text-white flex items-center gap-2 text-sm"><SparklesIcon className="w-5 h-5 text-indigo-300"/> AI 智能单据提取与结构化向导</h3>
                            <button onClick={onClose} className="text-indigo-200 hover:text-white"><X size={20}/></button>
                        </div>

                            <div className="w-[35%] border-r border-slate-200 bg-slate-50 p-4 flex flex-col">
                                <div className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider flex justify-between">
                                    <span>多模态凭证池</span>
                                    <span className="text-indigo-600">{mockUploadedFiles.length > 0 ? `${mockUploadedFiles.length} 份文件` : '空'}</span>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                                    {mockUploadedFiles.length === 0 ? (
                                        <div className="h-full flex flex-col items-center justify-center text-slate-400 opacity-60">
                                            <SvgIcon d={iconUpload} className="w-10 h-10 mb-2"/>
                                            <span className="text-xs text-center px-4">请从右侧点击上传工程凭证包</span>
                                        </div>
                                    ) : (
                                        mockUploadedFiles.map((file, idx) => (
                                            <div key={idx} className="bg-white border border-slate-200 p-2.5 rounded-sm flex items-center gap-2 shadow-sm relative overflow-hidden animate-in fade-in">
                                                <SvgIcon d={file.icon} className={`w-5 h-5 shrink-0 ${file.color}`} />
                                                <div className="flex-1 min-w-0"><div className="text-[11px] font-bold text-slate-800 truncate" title={file.name}>{file.name}</div></div>
                                                {aiPhase === 3 && <div className="scan-line" style={{animationDelay: `${idx * 0.2}s`}}></div>}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                            <div className="flex-1 bg-white p-6 flex flex-col justify-center relative">
                                {aiPhase === 0 && (
                                    <div className="text-center animate-in fade-in w-full max-w-lg mx-auto">
                                        <div className="border-2 border-dashed border-indigo-300 bg-indigo-50/50 rounded-2xl p-8 mb-6 cursor-pointer hover:bg-indigo-100/50 transition-colors group" onClick={handleUploadFiles}>
                                            <SvgIcon d={iconUpload} className="w-12 h-12 text-indigo-400 mx-auto mb-3 group-hover:scale-110 transition-transform" />
                                            <h4 className="text-lg font-bold text-slate-800 mb-2">步骤：上传多模态工程凭证包</h4>
                                            <p className="text-xs text-slate-500 leading-relaxed px-4">支持上传 ZIP 压缩包，或多选 PDF/JPG/视频文件作为底单凭证。</p>
                                        </div>
                                        <button onClick={handleUploadFiles} className="bg-indigo-600 text-white px-8 py-2.5 rounded shadow hover:bg-indigo-700 active:scale-95 text-sm font-bold flex items-center gap-2 mx-auto transition-all">
                                            <SvgIcon d={iconUpload} className="w-4 h-4"/> 浏览并上传本地凭证文件
                                        </button>
                                    </div>
                                )}
                                {aiPhase === 1 && (
                                    <div className="text-center animate-in fade-in flex flex-col items-center justify-center h-full">
                                        <div className="w-12 h-12 border-[4px] border-slate-200 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
                                        <h4 className="text-sm font-bold text-slate-700">正在载入并校验凭证包...</h4>
                                    </div>
                                )}
                                {aiPhase === 2 && (
                                    <div className="text-center animate-in fade-in flex flex-col items-center justify-center h-full">
                                        <div className="bg-green-50 border border-green-200 p-4 rounded-full mb-5">
                                            <CheckCircle2 size={40} className="text-green-500"/>
                                        </div>
                                        <h4 className="text-base font-bold text-slate-800 mb-2">文件包上传成功</h4>
                                        <p className="text-xs text-slate-500 mb-8 max-w-sm leading-relaxed">系统已将 8 份文件载入左侧缓冲池。您可以随时启动 AI 大模型进行特征识别与要素提取。</p>
                                        <button onClick={handleStartAnalysis} className="bg-blue-600 text-white px-8 py-3 rounded-lg shadow-md hover:bg-blue-700 hover:shadow-lg active:scale-95 text-sm font-bold flex items-center gap-2 transition-all">
                                            <SparklesIcon className="w-4 h-4"/> 启动智能解析与实物量提取
                                        </button>
                                    </div>
                                )}
                                {aiPhase === 3 && (
                                    <div className="text-center animate-in fade-in flex flex-col items-center w-full max-w-md mx-auto">
                                        <div className="w-14 h-14 border-[4px] border-indigo-100 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
                                        <h4 className="text-sm font-bold text-indigo-800 mb-2">正在进行多模态 OCR/NLP 解析分析...</h4>
                                        <div className="text-[11px] text-slate-500 font-mono space-y-1.5 mt-2 text-left bg-slate-50 w-full p-4 rounded border border-slate-200 shadow-inner">
                                            <p className="text-indigo-600 animate-pulse">> 正在提取并验证已选 WBS 节点结构...</p>
                                            <p className="text-indigo-600 animate-pulse" style={{animationDelay:'0.5s'}}>> 从【准入证】提取施工部位与工程实物量...</p>
                                            <p className="text-indigo-600 animate-pulse" style={{animationDelay:'1s'}}>> 校验并交叉关联各类耗材明细与底层附件...</p>
                                        </div>
                                    </div>
                                )}
                                {aiPhase === 4 && (
                                    <div className="flex flex-col h-full w-full max-w-md mx-auto animate-in fade-in justify-center">
                                        <div className="flex items-center justify-center gap-2 text-green-600 mb-5 border-b pb-3 mt-2">
                                            <div className="bg-green-100 p-1.5 rounded-full"><CheckCircle2 size={20}/></div>
                                            <span className="font-bold text-base">提取分析完成！</span>
                                        </div>
                                        <div className="space-y-3 flex-1 overflow-y-auto pr-1 custom-scrollbar">
                                            <div className="bg-indigo-50/80 border border-indigo-100 p-3 rounded-md text-sm flex justify-between items-center shadow-sm">
                                                <span className="text-slate-600">关联 WBS 确认</span><span className="font-bold text-indigo-700">C1-EL.250</span>
                                            </div>
                                            <div className="bg-green-50/80 border border-green-100 p-3 rounded-md text-sm flex justify-between items-center shadow-sm">
                                                <span className="text-slate-600">提取主工程量</span><span className="font-black text-blue-700 text-lg">1200 m³</span>
                                            </div>
                                            <div className="bg-slate-50 border border-slate-200 p-3 rounded-md text-sm flex justify-between items-center">
                                                <span className="text-slate-600">关联子项：耗材与台账</span><span className="font-bold text-slate-800">提取匹配成功 (100%)</span>
                                            </div>
                                            <div className="bg-slate-50 border border-slate-200 p-3 rounded-md text-sm flex justify-between items-center">
                                                <span className="text-slate-600">附件落库至对应明细</span><span className="font-bold text-indigo-600">8 个文件精准挂载</span>
                                            </div>
                                        </div>
                                        <div className="mt-4 pt-2">
                                            <button onClick={onConfirm} className="w-full bg-blue-600 text-white py-3 rounded font-bold shadow-md hover:bg-blue-700 active:scale-95 transition-all text-sm flex items-center justify-center gap-2">
                                                <CheckCircle2 size={16}/> 确认无误，生成产值明细底稿
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. BoQ 映射弹窗
        const SovAiBoqModal = ({ isOpen, onClose, onConfirm }) => {
            const [boqScanPhase, setBoqScanPhase] = useState(-1);
            const [boqLogs, setBoqLogs] = useState([]);
            
            useEffect(() => {
                if (isOpen) {
                    setBoqScanPhase(-1); setBoqLogs([]);
                }
            }, [isOpen]);

            const triggerAi = () => {
                setBoqScanPhase(0);
                const t1 = setTimeout(() => setBoqLogs(p => [...p, '> [接口联通] 建立与企业级《合同履约管理中台》API 的加密通道...']), 1000);
                const t2 = setTimeout(() => setBoqLogs(p => [...p, '> [特征提取] 启动领域大模型 (LLM)，提取前端提报项特征: "C25 混凝土"、"钢筋"...']), 3000);
                const t3 = setTimeout(() => setBoqLogs(p => [...p, '> [向量检索] 挂载 YX-2026 项目级标准 BoQ 知识库，生成词嵌向量 (Embeddings)...']), 5000);
                const t4 = setTimeout(() => setBoqLogs(p => [...p, '> [相似度计算] 计算多维空间余弦相似度，并自动校验合同计量规则边界...']), 7000);
                const t5 = setTimeout(() => { setBoqLogs(p => [...p, '> [映射完成] 发现高置信度匹配条目，即将渲染结构化关联表！']); }, 8500);
                const t6 = setTimeout(() => setBoqScanPhase(1), 9500);
                return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); clearTimeout(t4); clearTimeout(t5); clearTimeout(t6); };
            };

            const triggerManual = () => {
                setBoqScanPhase(2);
            };

            if (!isOpen) return null;
            return (
                <div className="absolute inset-0 z-[60] flex items-center justify-center bg-slate-900/70 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className="bg-white w-[90%] max-w-[880px] rounded-xl shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200 border border-slate-300">
                        <div className="bg-gradient-to-r from-blue-700 to-indigo-800 px-5 py-4 flex justify-between items-center text-white shrink-0">
                            <h3 className="font-bold text-sm flex items-center gap-2 tracking-wider"><Layers className="w-5 h-5 text-blue-200"/> 合同单价提取与关联系统</h3>
                            <button onClick={onClose} className="text-blue-200 hover:text-white transition-colors bg-white/10 p-1 rounded-md"><X size={20}/></button>

                        {boqScanPhase === -1 && (

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
                                    <div onClick={triggerAi} className="bg-white border-2 border-indigo-100 hover:border-indigo-400 hover:shadow-lg transition-all rounded-xl p-8 cursor-pointer group relative overflow-hidden flex flex-col items-center text-center">
                                        <div className="absolute top-0 right-0 bg-indigo-500 text-white text-[10px] font-bold px-3 py-1.5 rounded-bl-lg tracking-wider">智能推荐</div>
                                        <div className="bg-indigo-50 w-16 h-16 rounded-2xl flex items-center justify-center mb-5 group-hover:scale-110 transition-transform shadow-sm">
                                            <AIIcon className="w-8 h-8 text-indigo-600"/>
                                        </div>
                                        <h5 className="font-bold text-slate-800 mb-3 text-base">AI 智能语义映射</h5>
                                        <p className="text-xs text-slate-500 leading-relaxed">利用大模型提取业务特征，在项目知识库中进行多维空间向量检索，全自动完成高置信度单价映射。</p>
                                    </div>
                                    
                                    <div onClick={triggerManual} className="bg-white border-2 border-slate-200 hover:border-blue-400 hover:shadow-lg transition-all rounded-xl p-8 cursor-pointer group flex flex-col items-center text-center">
                                        <div className="bg-slate-50 w-16 h-16 rounded-2xl flex items-center justify-center mb-5 group-hover:scale-110 transition-transform shadow-sm border border-slate-100">
                                            <FolderTree className="w-8 h-8 text-slate-600"/>
                                        </div>
                                        <h5 className="font-bold text-slate-800 mb-3 text-base">标准人工寻址映射</h5>
                                        <p className="text-xs text-slate-500 leading-relaxed">打开标准合同 CBS/BoQ 结构树，由造价工程师手动勾选并绑定对应清单项，适用于复杂非标确权。</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {(boqScanPhase === 0 || boqScanPhase === 1) && (
                            <>
