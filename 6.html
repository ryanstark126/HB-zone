<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程管理云平台 - 资料协同(SSOT) 深度全功能版</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 和 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 编译器以支持浏览器端的 JSX 语法 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
        .animate-in { animation-fill-mode: both; }
        .fade-in { animation-name: fadeIn; }
        .slide-in-from-top-4 { animation-name: slideInTop; }
        .slide-in-from-bottom-2 { animation-name: slideInBottom; }
        .slide-in-from-right-4 { animation-name: slideInRight; }
        .slide-in-from-right-8 { animation-name: slideInRight8; }
        .zoom-in-95 { animation-name: zoomIn; }
        .duration-200 { animation-duration: 200ms; }
        .duration-300 { animation-duration: 300ms; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInTop { from { transform: translateY(-1rem) translateX(-50%); opacity: 0; } to { transform: translateY(0) translateX(-50%); opacity: 1; } }
        @keyframes slideInBottom { from { transform: translateY(0.5rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideInRight8 { from { transform: translateX(2rem); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* BIM 线框化滤镜 */
        .bim-wireframe { filter: sepia(1) hue-rotate(180deg) saturate(200%) brightness(0.8) contrast(1.5) invert(0.2); mix-blend-mode: screen; opacity: 0.85; }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }

        .typing-dot::after { content: '...'; animation: typing 1.5s infinite step-start; }
        @keyframes typing { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    </style>
</head>
<body class="bg-slate-100 antialiased overflow-hidden text-slate-900 h-screen w-screen flex flex-col">
    <div id="root" class="h-full w-full flex flex-col"></div>

    <!-- 注意：type="text/babel" 且 import 语句必须在最前 -->
    <script type="text/babel" data-type="module">
        import { 
          Building2, ChevronDown, Bell, Search, UserCircle, CheckCircle2, 
          XCircle, Clock, Menu, X, Layers, Archive, Lock, FileBadge, Eye,
          FileSpreadsheet, Box, PlayCircle, Download, Share2, MoreVertical, Maximize, Play, 
          Filter, ArrowRight, FileText, RefreshCw, SendToBack, Stamp, FileSignature, MapPin, 
          Image as ImageIcon, Plus, FolderTree, ShieldAlert, Camera, Inbox, AlertTriangle, 
          ArrowDown, ArrowRightLeft, Video, MessageSquare, History, LayoutDashboard,
          UploadCloud, FileUp, FilePlus, ArrowUpCircle, MessageCircle, GitCommit, Key, Link2,
          ShieldCheck, PenTool, CheckSquare, List, Send, Paperclip, Landmark, Bot, Sparkles, 
          Wand2, FileSearch, ActivitySquare, Fingerprint, FileCheck
        } from 'https://esm.sh/lucide-react@0.292.0';

        const { useState, useEffect, useRef, Fragment } = React;
        const { createRoot } = ReactDOM;

        // ================= 基础数据 =================
        const imgDam = "https://images.unsplash.com/photo-1541888081622-1f414cb207cc?auto=format&fit=crop&q=80&w=800"; 
        
        const ROLES = [
          { id: 'contractor', name: '承建方 (施工单位)', desc: '发起单据，提交发版，申请 RFI', color: 'bg-orange-100 text-orange-800' },
          { id: 'consultant', name: '监理与全咨', desc: '工程质量审查，回复 RFI 及下达指令', color: 'bg-purple-100 text-purple-800' },
          { id: 'owner', name: '业主方 (项目总控)', desc: '终审定板授权，签发变更签证', color: 'bg-blue-100 text-blue-800' }
        ];

        const MENU_DATA = [
          {
            id: 'collab', icon: Layers, title: '资料协同与沟通', desc: '全业务流转中心', 
            subMenus: [ 
              { id: 'doc-ssot', title: '验评与图文 (SSOT)' }, 
              { id: 'rfi-manage', title: '通信 RFI / 联办' },
              { id: 'change-trace', title: '变更溯源证据链' },
              { id: 'e-signature', title: '在线签章 / CA' } 
            ]
          }
        ];

        // ================= 公共子组件 =================

        // 垂直流程节点组件
        const FlowNode = ({ title, desc, role, status, isLast, actionBtn }) => {
            const isActive = status === 'active';
            const isDone = status === 'done';
            const isReject = status === 'reject';
            
            return (
                <div className="flex flex-col items-center w-full relative">
                    <div className={`w-[95%] rounded-lg p-4 border transition-all relative z-10 ${isDone ? 'bg-emerald-50 border-emerald-200' : isReject ? 'bg-red-50 border-red-200 shadow-sm' : isActive ? 'bg-blue-50 border-blue-400 shadow-[0_0_10px_rgba(59,130,246,0.3)] ring-2 ring-blue-100' : 'bg-slate-50 border-slate-200 opacity-60'}`}>
                        <div className="flex justify-between items-start mb-2.5">
                            <div className="flex items-center gap-2">
                                {isDone ? <CheckCircle2 size={16} className="text-emerald-500 shrink-0"/> : isReject ? <XCircle size={16} className="text-red-500 shrink-0"/> : isActive ? <RefreshCw size={16} className="text-blue-500 animate-spin shrink-0"/> : <Clock size={16} className="text-slate-400 shrink-0"/>}
                                <span className={`font-bold text-sm leading-tight ${isDone ? 'text-emerald-800' : isReject ? 'text-red-800' : isActive ? 'text-blue-800' : 'text-slate-500'}`}>{title}</span>
                            </div>
                            {isDone && <span className="text-[10px] text-emerald-600 font-mono shrink-0">14:00 录入</span>}
                        </div>
                        <div className="text-[11px] text-slate-600 mb-3 leading-relaxed">{desc}</div>
                        <div className="flex justify-between items-center border-t border-slate-200/60 pt-2.5">
                            <span className="text-[10px] font-bold bg-white px-2 py-0.5 rounded border border-slate-200 text-slate-500 flex items-center gap-1.5"><UserCircle size={12}/> {role}</span>
                        </div>
                        {(isActive || isReject) && actionBtn && (
                            <div className={`mt-3.5 border-t pt-3.5 animate-in fade-in ${isReject ? 'border-red-200/50' : 'border-blue-200/50'}`}>
                                {actionBtn}
                            </div>
                        )}
                    </div>
                    {!isLast && (
                        <div className="my-0.5 flex flex-col items-center justify-center h-6 w-full relative z-0">
                            <div className={`w-0.5 h-full ${isDone ? 'bg-emerald-400' : isReject ? 'bg-red-400' : 'bg-slate-200'} relative`}></div>
                            <ArrowDown size={14} className={`absolute -bottom-2 -left-[6px] ${isDone ? 'text-emerald-400' : isReject ? 'text-red-400' : 'text-slate-300'}`}/>
                        </div>
                    )}
                </div>
            );
        };

        // 包含 AI 解析流程的文件上传组件 (SSOT专用)
        const UploadDocumentModal = ({ isOpen, onClose, onSubmit, editDoc }) => {
            const [uploadState, setUploadState] = useState('idle'); // idle, file_selected, parsing, ready, submitting
            const [formData, setFormData] = useState({ name: '', discipline: '', type: 'doc', desc: '' });

            useEffect(() => {
                if (isOpen && editDoc) { 
                    setFormData({ name: editDoc.name, discipline: editDoc.discipline, type: editDoc.type, desc: '' }); 
                    setUploadState('ready');
                } else if (isOpen) { 
                    setFormData({ name: '', discipline: '', type: 'doc', desc: '' }); 
                    setUploadState('idle');
                }
            }, [isOpen, editDoc]);

            if (!isOpen) return null;
            const isNewVersion = !!editDoc;
            const newVersionNum = isNewVersion ? `V${(parseFloat(editDoc.version.replace('V', '')) + 1).toFixed(1)}` : 'V1.0';

            const handleFileSelect = () => {
                if (isNewVersion) return; 
                setUploadState('file_selected');
            };

            const triggerAIParsing = () => {
                setUploadState('parsing');
                setTimeout(() => {
                    setFormData({
                        name: '地下室机房设备基础预留预埋图纸',
                        discipline: '机电',
                        type: 'model',
                        desc: ''
                    });
                    setUploadState('ready');
                }, 2000);
            };

            const handleSubmit = () => {
                setUploadState('submitting');
                setTimeout(() => { onSubmit(formData, newVersionNum); }, 1000);
            };

            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
                    <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
                        <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center shrink-0">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                {isNewVersion ? <RefreshCw size={18} className="text-blue-500"/> : <UploadCloud size={18} className="text-blue-500"/>}
                                {isNewVersion ? '更新版本资料 (Revise)' : '起草新工程资料'}
                            </h3>
                            <button onClick={onClose} className="p-1 hover:bg-slate-200 rounded-md text-slate-500 transition-colors"><X size={18}/></button>
                        </div>
                        <div className="p-6 flex-1 overflow-y-auto">
                            
                            {/* 上传拖拽区或文件选中区 */}
                            {uploadState === 'idle' ? (
                                <div onClick={handleFileSelect} className="border-2 border-dashed border-blue-200 bg-blue-50/50 rounded-xl p-6 mb-6 text-center hover:bg-blue-50 hover:border-blue-400 transition-all cursor-pointer flex flex-col items-center justify-center">
                                    <FileUp size={40} className="text-blue-400 mb-3"/>
                                    <p className="font-bold text-slate-700 text-sm mb-1">点击选择本地文件</p>
                                    <p className="text-xs text-slate-500">支持 PDF, DWG 等格式</p>
                                </div>
                            ) : !isNewVersion && (
                                <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 mb-6 flex flex-col items-center justify-center relative overflow-hidden">
                                    <div className="flex items-center gap-3 w-full border-b border-indigo-100 pb-3 mb-3">
                                        <div className="p-2 bg-white rounded shadow-sm"><FileText size={20} className="text-indigo-500"/></div>
                                        <div className="min-w-0 flex-1">
                                            <div className="font-bold text-sm text-indigo-900 truncate">MEP_Underground_v1.dwg</div>
                                            <div className="text-xs text-indigo-500">14.2 MB</div>
                                        </div>
                                        {uploadState === 'ready' && <CheckCircle2 size={20} className="text-emerald-500"/>}
                                    </div>
                                    
                                    {uploadState === 'file_selected' && (
                                        <button onClick={triggerAIParsing} className="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-bold shadow hover:bg-indigo-700 flex justify-center items-center gap-2 animate-in zoom-in transition-all">
                                            <Sparkles size={16}/> 启动 AI 图纸/文档智能解析
                                        </button>
                                    )}
                                    {uploadState === 'parsing' && (
                                        <div className="w-full text-indigo-600 py-1 text-sm font-bold flex flex-col items-center justify-center gap-2">
                                            <RefreshCw size={20} className="animate-spin mb-1"/>
                                            <span className="typing-dot font-mono text-xs">大模型正在抽取标题及图框属性</span>
                                        </div>
                                    )}
                                    {uploadState === 'ready' && (
                                        <div className="w-full text-emerald-600 text-xs font-bold text-center bg-emerald-50 py-1.5 rounded flex items-center justify-center gap-1.5 border border-emerald-100">
                                            <Bot size={14}/> AI 抽取完毕，已自动填充下方表单
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* 动态表单 */}
                            <div className={`space-y-4 transition-opacity duration-500 ${uploadState === 'ready' || isNewVersion ? 'opacity-100' : 'opacity-30 pointer-events-none'}`}>
                                {isNewVersion && (
                                    <div className="bg-blue-50 p-3 rounded border border-blue-100 flex justify-between items-center text-sm mb-4">
                                        <span className="text-slate-600 font-bold">目标版本变更:</span>
                                        <div className="flex items-center gap-2 font-mono font-bold">
                                            <span className="text-slate-400 line-through">{editDoc.version}</span>
                                            <ArrowRight size={14} className="text-blue-500"/>
                                            <span className="text-blue-600 bg-white px-2 py-0.5 rounded shadow-sm">{newVersionNum}</span>
                                        </div>
                                    </div>
                                )}
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1">文档标题 <span className="text-red-500">*</span> {uploadState==='ready'&&!isNewVersion&&<Sparkles size={10} className="text-indigo-500"/>}</label>
                                    <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm"/>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1">所属专业 {uploadState==='ready'&&!isNewVersion&&<Sparkles size={10} className="text-indigo-500"/>}</label>
                                        <select value={formData.discipline} onChange={(e) => setFormData({...formData, discipline: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white">
                                            <option value="">请选择...</option>
                                            <option value="土建">土建 (CIV)</option><option value="机电">机电 (MEP)</option><option value="安全">安全 (HSE)</option><option value="质量">质量 (QAL)</option><option value="测绘">测绘 (SUR)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">资料类型</label>
                                        <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white">
                                            <option value="doc">文档卷册</option><option value="model">图纸模型</option><option value="image">现场影像</option><option value="video">音视频</option><option value="form">验评表单</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5">修改/分发说明</label>
                                    <textarea value={formData.desc} onChange={(e) => setFormData({...formData, desc: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm resize-none h-16" placeholder="请简要描述发版目的或修改点..."></textarea>
                                </div>
                            </div>
                        </div>
                        <div className="bg-slate-50 px-6 py-4 border-t border-slate-200 flex justify-end gap-3 shrink-0">
                            <button onClick={onClose} disabled={uploadState === 'submitting'} className="px-5 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg font-bold text-xs">取消</button>
                            <button onClick={handleSubmit} disabled={uploadState !== 'ready' || !formData.name || !formData.discipline} className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-xs shadow-md flex items-center gap-2 disabled:opacity-50 transition-colors">
                                {uploadState === 'submitting' ? <RefreshCw size={14} className="animate-spin"/> : <CheckCircle2 size={14}/>}
                                {uploadState === 'submitting' ? '处理中...' : (isNewVersion ? '确认升版并流转' : '保存文档草稿')}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 发起 RFI 弹窗 (带 AI 辅助)
        const CreateRfiModal = ({ isOpen, onClose, onSubmit }) => {
            const [subject, setSubject] = useState('');
            const [text, setText] = useState('');
            const [isAiSuggesting, setIsAiSuggesting] = useState(false);

            if (!isOpen) return null;

            const triggerAiSuggest = () => {
                setIsAiSuggesting(true);
                setTimeout(() => {
                    setSubject('紧急：地下室管线与结构标高冲突确认');
                    setText('现场开挖后发现，A区地下室原设计管线标高与实际岩层标高存在严重冲突。若按原图纸施工，主引水管将无法穿过承重梁。由于后天需封模打混凝土，请设计与监理单位紧急核实并给出调整指导意见，避免大面积返工。');
                    setIsAiSuggesting(false);
                }, 1500);
            };

            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in">
                    <div className="bg-white w-full max-w-xl rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95">
                        <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center shrink-0">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><Plus size={18} className="text-blue-500"/> 发起新 RFI 函件</h3>
                            <button onClick={onClose} className="p-1 hover:bg-slate-200 rounded-md text-slate-500 transition-colors"><X size={18}/></button>
                        </div>
                        <div className="p-6 flex-1 space-y-4">
                            <button onClick={triggerAiSuggest} disabled={isAiSuggesting} className="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors mb-2">
                                {isAiSuggesting ? <RefreshCw size={16} className="animate-spin"/> : <Sparkles size={16}/>}
                                {isAiSuggesting ? 'AI 正在分析您的图纸并撰写描述...' : 'AI 辅助快速起草 RFI'}
                            </button>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1.5">主题 (Subject) *</label>
                                <input type="text" value={subject} onChange={e=>setSubject(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm" placeholder="一句话概括问题核心..."/>
                            </div>
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5">优先级</label>
                                    <select className="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white"><option>高 (High)</option><option>中 (Normal)</option><option>低 (Low)</option></select>
                                </div>
                                <div className="flex-1">
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5">期望回复时间</label>
                                    <input type="date" className="w-full px-3 py-2 border border-slate-300 rounded text-sm"/>
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1.5">疑问详细描述</label>
                                <textarea value={text} onChange={e=>setText(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded text-sm resize-none h-32" placeholder="请详细描述需要澄清或确认的技术问题..."></textarea>
                            </div>
                        </div>
                        <div className="bg-slate-50 px-6 py-4 border-t border-slate-200 flex justify-end gap-3 shrink-0">
                            <button onClick={onClose} className="px-5 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg font-bold text-sm">取消</button>
                            <button onClick={()=>{ onSubmit(subject, text); onClose(); }} disabled={!subject || !text} className="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold text-sm shadow flex items-center gap-2 disabled:opacity-50">
                                <Send size={14}/> 发送 RFI
                            </button>
                        </div>
                    </div>
                </div>
            );
        };


        // ================= 核心 App 应用 =================
        function App() {
          const [currentRole, setCurrentRole] = useState(ROLES[0]); // 默认承建方
          const [expandedMenus, setExpandedMenus] = useState(['collab']);
          const [activeMenu, setActiveMenu] = useState('doc-ssot'); 
          const [isSidebarOpen, setIsSidebarOpen] = useState(true);
          const [toast, setToast] = useState(null);
          const [viewerData, setViewerData] = useState(null); 

          const showToast = (message) => { setToast(message); setTimeout(() => setToast(null), 4000); };
          const toggleMenu = (menuId) => { setExpandedMenus(prev => prev.includes(menuId) ? prev.filter(id => id !== menuId) : [...prev, menuId]); };

          // --- 模块 1: 验评与图文 (SSOT) 状态 ---
          const [docs, setDocs] = useState([
              { id: 1, docNo: 'CIV-RPT-001', name: '大坝主体C25混凝土施工方案.pdf', type: 'doc', discipline: '土建', version: 'V2.0', phase: 3, reviewCode: 'Code A', uploader: '张工 (第一工程局)', date: '2026-05-15', icon: FileText, color: 'text-blue-500', history: [{ v: 'V1.0', action: 'Approved', date: '05-10' }, { v: 'V2.0', action: 'Approved', date: '05-15' }] },
